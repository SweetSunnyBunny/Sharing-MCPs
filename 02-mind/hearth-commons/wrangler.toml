name = "hearth-commons"
main = "src/index.ts"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[vars]
COMMONS_BASE_URL = "https://YOUR-COMMONS-HOST.example.com"
PUBLIC_URL = "https://YOUR-WORKER.YOUR-ACCOUNT.workers.dev"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "YOUR-OAUTH-KV-ID"
