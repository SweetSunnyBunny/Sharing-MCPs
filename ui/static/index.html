<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Anam &mdash; Soul of Heaven</title>

    <!-- PWA manifest + app icon -->
    <link rel="manifest" href="/static/manifest.json?v=__ANAM_ASSET_VERSION__">
    <link rel="apple-touch-icon" href="/static/assets/icons/app_icon.png?v=__ANAM_ASSET_VERSION__">
    <meta name="theme-color" content="#F2B8C6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Anam">

    <!-- Preload critical body font to avoid flash of unstyled text -->
    <link rel="preload" as="font" type="font/woff2" href="/static/fonts/fredoka-latin.woff2?v=__ANAM_ASSET_VERSION__" crossorigin>

    
    <script>
        (() => {
            try {
                const saved = localStorage.getItem('anam-identity');
                const cached = JSON.parse(localStorage.getItem('anam-identity-paint') || 'null');
                if (!cached || !cached.name || !cached.tokens) return;
                if (saved && cached.name !== saved) return;
                for (const [key, value] of Object.entries(cached.tokens)) {
                    if (key.startsWith('--identity-') || key.startsWith('--bubble-md-')) {
                        document.documentElement.style.setProperty(key, value);
                    }
                }
            } catch (_err) { /* first visit, private mode, or corrupt cache */ }
        })();
    </script>

    <!-- Stylesheets (cache bust) — critical sheets block first paint; the rest load async -->
    
    <link rel="stylesheet" href="/static/css/main.css?v=__ANAM_ASSET_VERSION__">
    <link rel="stylesheet" href="/static/css/anam.css?v=__ANAM_ASSET_VERSION__">

    <style>
        /* Inline fallback for fonts loading */
        body { font-family: 'Fredoka', 'Nunito', 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    
    <div id="fairy-lights" class="fairy-lights"></div>

    <!-- Connection status -->
    <div id="connection-status" class="connection-status"></div>

    <!-- Sidebar overlay + panel -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">

            <h2 class="sidebar-title">Conversations</h2>

    <!-- ANAM GUIDE: MAIN CHAT PAGE

         static/js for behavior and static/css for appearance. -->

            <div id="context-gauge-bar" class="context-gauge-bar" style="display:none" aria-hidden="true"></div>
            <div class="header-left">
                <button id="sidebar-toggle" class="sidebar-toggle-btn" title="Conversations" aria-label="Open conversations">&#9776;</button>

            <div class="header-controls">

                <button id="hub-btn" class="hub-btn" title="Home" aria-label="Open home menu"><img src="__ANAM_CDN_URL__/icons/Home_Hub.png" alt="Home" class="btn-icon"></button>

            <button id="message-search-prev" class="message-search-nav" aria-label="Previous match">&#x25B2;</button>
            <button id="message-search-next" class="message-search-nav" aria-label="Next match">&#x25BC;</button>
            <button id="message-search-close" class="message-search-close" aria-label="Close search">&times;</button>
        </div>

        <!-- Deep search overlay -->

                </div>
            </div>

            <!-- Chat area -->

                    </div>
                </div>
            </div>

            <!-- ANAM GUIDE: CHAT INPUT STRUCTURE
                 The matching appearance is under CHAT INPUT COLORS in
                 anam.css (SECTION 1: CHAT); sending behavior starts at Chat.sendMessage(). -->
            <!-- Input area -->
            <div class="input-area">
                <div id="image-preview" class="image-preview" style="display:none">
                    <div id="image-preview-grid" class="image-preview-grid"></div>
                    <button id="image-preview-remove" class="image-preview-remove" title="Clear all" aria-label="Clear all images">&times;</button>
                </div>
                <div class="input-wrapper">

                    <div class="attach-wrapper">
                        <button id="emoji-btn" class="attach-btn emoji-btn" title="Custom emoji" aria-label="Insert a custom emoji">☺</button>
                        <button id="gif-btn" class="attach-btn gif-btn" title="Send a GIF" aria-label="Send a GIF">GIF</button>
                        <button id="attach-btn" class="attach-btn" title="Attach file" aria-label="Attach file">
                            <img src="__ANAM_CDN_URL__/icons/Attach.png" alt="Attach" class="btn-icon">
                        </button>
                    </div>
                    
                    <div id="emoji-picker" class="emoji-panel" style="display:none">
                        <div class="emoji-panel-head">
                            <input type="text" id="emoji-search-input" class="emoji-search-input" placeholder="Search emoji..." autocomplete="off">
                            <button id="emoji-picker-close" class="emoji-panel-close" aria-label="Close emoji picker">&times;</button>
                        </div>
                        <div id="emoji-results" class="emoji-results"></div>
                        <div id="emoji-preview" class="emoji-preview"></div>
                    </div>
                    <!-- GIF picker panel -->
                    <div id="gif-picker" class="gif-picker" style="display:none">
                        <div class="gif-picker-tabs">
                            <button id="gif-tab-search" class="gif-tab active">Search</button>
                            <button id="gif-tab-mine" class="gif-tab">My GIFs</button>
                            <button id="gif-picker-close" class="gif-picker-close" aria-label="Close GIF picker">&times;</button>
                        </div>
                        <input type="text" id="gif-search-input" class="gif-search-input" placeholder="Search GIFs..." autocomplete="off">
                        <div id="gif-results" class="gif-results"></div>
                    </div>
                    <textarea id="message-input"
                              placeholder="Message Avery..."

                              autocomplete="off"></textarea>
                    <button id="send-btn" class="send-btn" title="Send" aria-label="Send message">
                        <img src="__ANAM_CDN_URL__/icons/Chat.png" alt="Send" class="btn-icon send-icon">

                </div>
            </div>

    <!-- Hub overlay (home menu) -->

    <!-- Wellness modal -->
    <div id="wellness-overlay" class="modal-overlay" style="display:none">
        <div class="modal-card wellness-modal" role="dialog" aria-modal="true" aria-label="Wellness check-in">
            <div class="modal-header">
                <h3 class="modal-title">How are you doing?</h3>
                <button id="wellness-close" class="modal-close-btn" aria-label="Close">&times;</button>
            </div>
            <form id="wellness-form" class="wellness-form">
                <div class="wellness-field">
                    <label for="w-energy">Energy</label>
                    <select id="w-energy" name="energy">
                        <option value="">&mdash;</option>
                        <option value="high">High</option>
                        <option value="moderate">Moderate</option>
                        <option value="low">Low</option>
                        <option value="crashed">Crashed</option>
                    </select>
                </div>
                <div class="wellness-field">
                    <label for="w-mood">Mood</label>
                    <select id="w-mood" name="mood">
                        <option value="">&mdash;</option>
                        <option value="great">Great</option>
                        <option value="good">Good</option>
                        <option value="okay">Okay</option>
                        <option value="struggling">Struggling</option>
                        <option value="rough">Rough</option>
                    </select>
                </div>
                <div class="wellness-field">
                    <label for="w-pain">Pain</label>
                    <select id="w-pain" name="pain">
                        <option value="">&mdash;</option>
                        <option value="none">None</option>
                        <option value="mild">Mild</option>
                        <option value="moderate">Moderate</option>
                        <option value="bad">Bad</option>
                        <option value="severe">Severe</option>
                    </select>
                </div>
                <div class="wellness-field">
                    <label for="w-spoons">Spoons</label>
                    <input id="w-spoons" name="spoons" type="number" min="0" max="20" placeholder="0-20">
                </div>
                <div class="wellness-field">
                    <label for="w-sleep-hours">Sleep (hrs)</label>
                    <input id="w-sleep-hours" name="sleep_hours" type="number" min="0" max="24" step="0.5" placeholder="hrs">
                </div>
                <div class="wellness-field">
                    <label for="w-sleep-quality">Sleep quality</label>
                    <select id="w-sleep-quality" name="sleep_quality">
                        <option value="">&mdash;</option>
                        <option value="great">Great</option>
                        <option value="good">Good</option>
                        <option value="okay">Okay</option>
                        <option value="poor">Poor</option>
                        <option value="terrible">Terrible</option>
                    </select>
                </div>
                <div class="wellness-field">
                    <label for="w-water">Water (oz)</label>
                    <input id="w-water" name="water_oz" type="number" min="0" max="300" placeholder="oz">
                </div>
                <div class="wellness-field">
                    <label for="w-soda">Sodas</label>
                    <input id="w-soda" name="soda_count" type="number" min="0" max="20" placeholder="#">
                </div>
                <div class="wellness-field full-width">
                    <label for="w-notes">Notes</label>
                    <textarea id="w-notes" name="notes" rows="2" placeholder="How are you feeling?"></textarea>
                </div>
                <div class="wellness-actions">
                    <button type="submit" class="action-btn save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Image gallery overlay -->
    <div id="image-gallery" class="image-gallery-overlay" style="display:none">
        <div class="image-gallery-panel" role="dialog" aria-modal="true" aria-label="Image gallery">
            <div class="gallery-header">
                <h3 class="gallery-title">Images</h3>
                <div class="gallery-tabs">
                    <button class="gallery-tab active" data-tab="chat">This Chat</button>
                    <button class="gallery-tab" data-tab="all">All Images</button>
                </div>
                <button id="gallery-close" class="modal-close-btn" aria-label="Close">&times;</button>
            </div>
            <div id="gallery-grid" class="gallery-grid"></div>
        </div>
    </div>

    <div id="story-state-overlay" class="modal-overlay" style="display:none">
        <div class="modal-card" role="dialog" aria-modal="true" aria-label="Edit story state">
            <div class="modal-header">
                <h3 class="modal-title">Story State <span id="story-state-identity-label" class="story-state-identity"></span></h3>
                <button id="story-state-close" class="modal-close-btn" aria-label="Close">&times;</button>
            </div>
            <form id="story-state-form" class="wellness-form">
                <div class="wellness-field">
                    <label for="story-state-era">Era</label>
                    <input id="story-state-era" name="era" type="text" maxlength="100" placeholder="UA-era / Pro-Hero / Season 1">
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-in-fic-day">In-fic Day</label>
                    <input id="story-state-in-fic-day" name="in_fic_day" type="text" maxlength="180" placeholder="e.g., Tuesday morning, UA dorm common room">
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-location">Location</label>
                    <input id="story-state-location" name="location" type="text" maxlength="180" placeholder="Where the scene opens — dorm kitchen, Impala, gym 3, motel room">
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-who-else">Who Else Is In Earshot</label>
                    <input id="story-state-who-else" name="who_else" type="text" maxlength="180" placeholder="Bakusquad nearby / Sam in next room / alone — changes the register">
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-tone-flavor">Tone / Flavor</label>
                    <input id="story-state-tone-flavor" name="tone_flavor" type="text" maxlength="180" placeholder="Banter / soft / spicy / angst / comfort / training — the vibe register">
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-emotional-temperature">Emotional Temperature</label>
                    <input id="story-state-emotional-temperature" name="emotional_temperature" type="text" maxlength="240" placeholder="One sentence — where they are emotionally right now">
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-last-scene">Last Scene</label>
                    <textarea id="story-state-last-scene" name="last_scene" rows="3" placeholder="2–4 sentences: what happened, who's in the scene, where it ended"></textarea>
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-character-state">Character State (in-fic)</label>
                    <textarea id="story-state-character-state" name="character_state" rows="2" placeholder="Character's body & mood at scene-open — in-fic, NOT real-world Owner"></textarea>
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-whats-promised">What's Promised</label>
                    <textarea id="story-state-whats-promised" name="whats_promised" rows="3" placeholder="Bulleted (-) list — what either character said they'd do, beats coming up"></textarea>
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-beats-to-hit">Beats I Want To Hit</label>
                    <textarea id="story-state-beats-to-hit" name="beats_to_hit" rows="2" placeholder="Bulleted (-) list — positive direction for this session"></textarea>
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-not-this-today">Not This Today</label>
                    <textarea id="story-state-not-this-today" name="not_this_today" rows="2" placeholder="Bulleted (-) list — negative direction, what to avoid this session"></textarea>
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-open-threads">Open Threads</label>
                    <textarea id="story-state-open-threads" name="open_threads" rows="3" placeholder="Bulleted (-) list — unresolved plot/scene threads"></textarea>
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-recent-beats">Recent Beats</label>
                    <textarea id="story-state-recent-beats" name="recent_beats" rows="3" placeholder="Bulleted (-) list — one line each, keep ~5 max"></textarea>
                </div>
                <div class="wellness-field full-width">
                    <label for="story-state-callback-anchors">Callback Anchors</label>
                    <textarea id="story-state-callback-anchors" name="callback_anchors" rows="3" placeholder="Bulleted (-) list — specific phrases, jokes, objects to remember"></textarea>
                </div>
                <div class="wellness-actions">
                    <button type="submit" class="action-btn save">Save Story State</button>
                    <span id="story-state-status" class="story-state-status" aria-live="polite"></span>
                </div>
            </form>
        </div>
    </div>

    <!-- ANAM GUIDE: MAIN CHAT JAVASCRIPT LOAD ORDER
         Dependencies must be loaded before app.js boots the page. -->
    <!-- Scripts (order matters, cache bust) -->
    <script>
        window.__ANAM_ASSET_VERSION__ = '__ANAM_ASSET_VERSION__';
        window.__ANAM_SW_URL__ = `/sw.js?v=${window.__ANAM_ASSET_VERSION__}`;
        window.__anamCdnUrl = '##ANAM_CDN_URL##';
        window.__anamApiUrl = '##ANAM_API_URL##';
        window.__sanctuaryApiBase = '##SANCTUARY_API_BASE##';
        window.__ANAM_PUBLIC_BASE_URL__ = (() => {
            try {
                return JSON.parse('__ANAM_PUBLIC_BASE_URL__');
            } catch (_err) {
                return '';
            }
        })();
    </script>
