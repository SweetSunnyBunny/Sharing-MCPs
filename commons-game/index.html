<html lang="en">
<head>
<meta charset="utf-8">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:#0d0a0c;color:#e8ddd0;font-family:Georgia,serif;
       display:flex;flex-direction:column;align-items:center;
       touch-action:none;-webkit-user-select:none;user-select:none;
       -webkit-tap-highlight-color:transparent}
  #stage{position:relative;flex:1 1 auto;width:100%;overflow:hidden;background:#0d0a0c}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  #title{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;
         transform:translateX(-50%);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;
         color:#d8c8b4;text-shadow:0 2px 10px #000,0 0 22px #000;pointer-events:none;z-index:3;
         font-weight:normal;opacity:.85}
  #bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 34px);left:50%;
       transform:translateX(-50%);font-size:.66rem;color:#bda98f;text-align:center;
       text-shadow:0 2px 8px #000,0 0 18px #000;pointer-events:none;z-index:3;
       opacity:.75;transition:opacity .8s}
  #bar.gone{opacity:0}

  
  #pad{position:absolute;left:calc(env(safe-area-inset-left,0px) + 14px);
       bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
       width:150px;height:150px;z-index:5;touch-action:none;
       display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
  #pad b{display:flex;align-items:center;justify-content:center;
         background:rgba(22,17,15,.52);border:1px solid rgba(212,162,74,.34);
         color:#e2cfa8;font-size:1.15rem;font-weight:normal;border-radius:9px;
         backdrop-filter:blur(2px);transition:background .08s,transform .08s}
  #pad b.on{background:rgba(212,162,74,.42);color:#fff6e2;transform:scale(.94)}
  #pad .u{grid-area:1/2} #pad .l{grid-area:2/1} #pad .r{grid-area:2/3} #pad .d{grid-area:3/2}
  #pad .c{grid-area:2/2;background:none;border:none;pointer-events:none;
          color:rgba(212,162,74,.30);font-size:.7rem}
  
  #pad{display:none}

  
  #stick{position:absolute;right:calc(env(safe-area-inset-right,0px) + 16px);
       top:calc(env(safe-area-inset-top,0px) + 58px);
       width:124px;height:124px;z-index:6;touch-action:none;border-radius:50%;
       background:rgba(22,17,15,.42);border:1px solid rgba(212,162,74,.34);
       backdrop-filter:blur(2px)}
  #stick .nub{position:absolute;left:50%;top:50%;width:52px;height:52px;
       margin:-26px 0 0 -26px;border-radius:50%;
       background:rgba(212,162,74,.38);border:1px solid rgba(212,162,74,.6);
       box-shadow:0 2px 8px rgba(0,0,0,.4);transition:background .08s}
  #stick.live .nub{background:rgba(212,162,74,.62)}

  #tools{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);
         bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;
         display:flex;flex-direction:column;gap:10px}
  #tools button{width:54px;height:54px;border-radius:50%;font-size:1.25rem;
         background:rgba(22,17,15,.62);border:1px solid rgba(212,162,74,.38);
         color:#e2cfa8;backdrop-filter:blur(2px);cursor:pointer;font-family:inherit}
  #tools button:active{background:rgba(212,162,74,.42)}
  #mineBtn{position:relative}
  #mineBtn[data-count]::after{content:attr(data-count);position:absolute;right:-3px;top:-4px;
       min-width:19px;height:19px;padding:0 4px;border-radius:10px;display:flex;
       align-items:center;justify-content:center;background:#c0394b;color:#fff6e2;
       border:1px solid #e2cfa8;font:600 11px/1 Georgia,serif;box-shadow:0 2px 8px #000}

  
  :root{
    
    --ui-panel:none;
    --ui-plate:none;
    --ui-knot:none;
    --ui-covenant:none;
    --ui-divider:none;
    --ui-ink:#332A2A;          
    --ui-gold:#C89B4A;
    --dlg-accent:#B89A6A;      
  }
  #dlg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
       width:min(94%,620px);display:none;z-index:7;
       font-family:'Lora',Georgia,serif;}
  #dlg.up{display:block;animation:dlgIn .22s ease-out both}
  @keyframes dlgIn{from{opacity:0;transform:translateX(-50%) translateY(9px)}
                     to{opacity:1;transform:translateX(-50%) translateY(0)}}
  
  #dlg .dpanel{position:relative;width:100%;aspect-ratio:1431/737;
       background-image:var(--ui-panel),linear-gradient(#F2D4DC,#F2D4DC);
       background-size:100% 100%,97% 94%;
       background-position:center,center;
       background-repeat:no-repeat,no-repeat;
       
       border-radius:14px;cursor:pointer;
       animation:dlgGlow 1.1s ease-out .18s both;}
  @keyframes dlgGlow{0%{filter:drop-shadow(0 0 14px rgba(212,173,92,.85))}
                   100%{filter:drop-shadow(0 6px 22px rgba(0,0,0,.55))}}
  
  #dlg .plate{position:absolute;left:1%;top:0;transform:translateY(-46%);
       min-width:26%;max-width:62%;height:19%;
       background:var(--ui-plate) left center/100% 100% no-repeat;
       display:flex;align-items:center;gap:.4em;padding:0 12% 0 3%;
       box-sizing:border-box;animation:plateIn .3s ease-out .16s both;}
  @keyframes plateIn{from{opacity:0;transform:translateY(-42%) translateX(-14px)}
                       to{opacity:1;transform:translateY(-42%) translateX(0)}}
  #dlg.nospeaker .plate{display:none}
  
  #dlg .sysorn{position:absolute;left:50%;top:0;transform:translate(-50%,-46%);
       width:24%;aspect-ratio:295/93;display:none;
       background:var(--ui-divider) center/contain no-repeat;
       animation:plateIn .3s ease-out .16s both;}
  #dlg.nospeaker .sysorn{display:block}
  
  #dlg .floret{position:relative;flex:0 0 auto;height:74%;aspect-ratio:182/179;
       background:var(--dlg-accent);
       -webkit-mask:var(--ui-knot) center/contain no-repeat;
               mask:var(--ui-knot) center/contain no-repeat;}
  #dlg .floret::after{content:'';position:absolute;inset:0;
       background:var(--ui-knot) center/contain no-repeat;
       mix-blend-mode:multiply;}
  #dlg .who{font-family:'Cinzel',Georgia,serif;font-weight:600;
       color:var(--dlg-accent);font-size:clamp(12px,3.4vw,17px);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
       letter-spacing:.01em;}
  
  
  
  #dlg .dbody{position:absolute;left:23%;right:15%;top:13%;bottom:16%;
       overflow:hidden;color:var(--ui-ink);
       display:flex;flex-direction:column;}
  #dlg.nospeaker .dbody{left:20%;top:17%}
  #dlg .dtitle{display:block;font-family:'Cinzel',Georgia,serif;
       font-size:clamp(10px,2.5vw,12.5px);letter-spacing:.05em;
       color:#8a6a58;margin-bottom:.25em;}
  #dlg .dtext{display:block;font-size:clamp(12px,3.2vw,15.5px);line-height:1.5;
       white-space:pre-wrap;word-break:break-word;
       flex:1 1 auto;min-height:0;overflow:hidden;}
  #dlg .dfoot{display:block;flex:0 0 auto;margin-top:.5em;font-size:clamp(9px,2.2vw,11px);
       font-style:italic;color:#9a7f70;}
  
  #dlg .dnext{position:absolute;right:5%;bottom:7%;display:flex;
       align-items:center;gap:.45em;pointer-events:none;}
  #dlg .chev{font-size:clamp(11px,2.8vw,14px);color:var(--ui-gold);
       letter-spacing:.08em;opacity:0;transition:opacity .25s;}
  #dlg.more .chev{opacity:1;animation:chevPulse 1.5s ease-in-out infinite}
  @keyframes chevPulse{0%,100%{opacity:.28}50%{opacity:1}}
  #dlg .covenant{width:clamp(26px,7vw,40px);aspect-ratio:264/216;
       background:var(--ui-covenant) center/contain no-repeat;}
  #dlg.more .covenant{animation:covPulse 1.5s ease-in-out infinite}
  @keyframes covPulse{0%,100%{transform:scale(1);opacity:.9}
                        50%{transform:scale(1.07);opacity:1}}
  #dlg .dx{position:absolute;right:1.2%;top:2%;width:28px;height:28px;
       display:flex;align-items:center;justify-content:center;
       color:#a8836a;font-size:19px;line-height:1;cursor:pointer;
       border-radius:50%;}
  #dlg .dx:active{background:rgba(51,42,42,.12)}
  
  #dlg .dacts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  @media (prefers-reduced-motion: reduce){
    #dlg.up,#dlg .dpanel,#dlg .plate,#dlg .sysorn,
    #dlg.more .chev,#dlg.more .covenant{animation:none!important}
    #dlg .dpanel{filter:drop-shadow(0 6px 22px rgba(0,0,0,.55))}
    #dlg .chev{opacity:1}
  }

  
  #pic{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
       background:rgba(8,6,5,.94);padding:14px;box-sizing:border-box;}
  #pic img{max-width:100%;max-height:calc(100% - 46px);border-radius:6px;
           border:1px solid #6b4a2a;box-shadow:0 10px 40px rgba(0,0,0,.7);}
  #pic .cap{position:absolute;left:0;right:0;bottom:10px;text-align:center;
            color:#d9c39a;font-size:13px;padding:0 16px;line-height:1.4;}
  #pic .x{position:absolute;top:10px;right:16px;color:#d4a24a;font-size:30px;
          cursor:pointer;line-height:1;}
  
  .picrow{display:flex;gap:8px;align-items:center;margin-top:9px;}
  .picrow button{background:#241a14;color:#d4a24a;border:1px solid #6b4a2a;
                 border-radius:6px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;}
  .picrow span{color:#9b8a74;font-size:12px;}
  .picthumb{width:38px;height:38px;object-fit:cover;border-radius:4px;border:1px solid #6b4a2a;}
  #ask{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
       background:rgba(6,4,5,.82);backdrop-filter:blur(3px);padding:22px}
  
  #ask .box{background:#16110f;border:1px solid #6b4a2a;border-radius:8px;padding:18px;
       width:100%;max-width:330px;box-shadow:0 8px 40px #000;
       max-height:calc(100% - 8px);display:flex;flex-direction:column}
  #ask .box>p{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
       overscroll-behavior:contain}
  #ask h2,#ask .row{flex:0 0 auto}
  #ask h2{font-size:.95rem;font-weight:normal;color:#d4a24a;margin-bottom:4px}
  #ask p{font-size:.72rem;color:#8a7a6a;margin-bottom:12px;line-height:1.45}
  #ask input,#ask textarea{width:100%;background:#0d0a0c;border:1px solid #3a2f2a;color:#e8ddd0;
       padding:9px;border-radius:5px;font-family:inherit;font-size:.85rem;resize:none}
  #ask textarea{height:88px}
  
  #ask.convo .box{max-width:392px;height:min(560px,calc(100% - 8px));padding:14px;position:relative}
  #ask.convo h2{margin-bottom:2px}
  
  #ask.convo .row{display:block;position:absolute;top:7px;right:9px;margin:0}
  #ask.convo #askNo{display:none}
  #ask.convo #askYes{padding:2px 11px;font-size:.72rem;line-height:1.6}
  #ask.convo .box>p{margin-bottom:0;display:flex;flex-direction:column;gap:7px;
       border-top:1px solid #2a211d;padding-top:11px}
  #ask.convo #askI,#ask.convo #askX{display:none!important}
  
  #convoSay{display:none;flex:0 0 auto;margin-top:9px;text-align:center;

  #ask.convo #convoSay.on{display:block}
  #convoBar{display:none;flex:0 0 auto;gap:7px;align-items:flex-end;margin-top:10px;
       border-top:1px solid #2a211d;padding-top:10px}
  #ask.convo #convoBar{display:flex}
  
  #convoPortraitFrame{position:relative;flex:0 0 52px;width:52px;height:58px;
       align-self:flex-end;overflow:hidden;border:1px solid var(--convo-accent,#b89a6a);
       border-radius:13px 13px 7px 7px;background:#171113;
       box-shadow:0 3px 12px rgba(0,0,0,.35)}
  #convoPortrait{display:none;width:100%;height:100%;object-fit:cover;
       object-position:50% 17%}
  #convoPortraitMark{position:absolute;inset:0;display:flex;align-items:center;
       justify-content:center;color:var(--convo-accent,#b89a6a);
       font-family:'Cinzel',Georgia,serif;font-size:1.15rem;background:#171113}
  #convoPortraitFrame.has-portrait #convoPortrait{display:block}
  #convoPortraitFrame.has-portrait #convoPortraitMark{display:none}
  #convoWho{flex:0 0 82px;max-width:92px;min-height:38px;background:#0d0a0c;
       border:1px solid #3a2f2a;color:#cdbb9f;padding:7px 5px;border-radius:5px;
       font-family:inherit;font-size:.72rem}
  #convoX{flex:1 1 auto;min-height:38px;max-height:104px;background:#0d0a0c;
       border:1px solid #3a2f2a;color:#e8ddd0;padding:9px;border-radius:5px;
       font-family:inherit;font-size:.85rem;resize:none;line-height:1.4}
  #convoX:focus{outline:none;border-color:#6b4a2a}
  #convoGo{flex:0 0 auto;padding:10px 13px;border-radius:5px;font-family:inherit;
       font-size:.8rem;border:1px solid #6b4a2a;background:#6b4a2a;color:#fff6e2;
       cursor:pointer;white-space:nowrap}
  #convoGo[disabled],#convoX[disabled],#convoWho[disabled]{opacity:.42;cursor:default}
  #ask .msg{max-width:88%;padding:7px 10px;border-radius:9px;background:#0d0a0c;
       border:1px solid #2a211d;align-self:flex-start;text-align:left;
       font-family:inherit;font-size:.8rem;color:#e8ddd0;cursor:default;margin-top:0}
  
  #ask .msg.self{align-self:flex-end;background:#241a15;border-color:#6b4a2a}
  
  #ask .msg b{display:block;font-weight:normal;font-size:.68rem;
       letter-spacing:.05em;margin-bottom:3px;font-style:normal}
  #ask .msg i{display:block;font-style:normal;font-size:.8rem;line-height:1.45;
       color:#e8ddd0;white-space:pre-wrap;overflow-wrap:anywhere}
  #ask .msg u{display:block;text-decoration:none;color:#8a7a6a;font-size:.58rem;
       letter-spacing:0;text-transform:none;margin:4px 0 0}
  #ask .msg.activity{border-left:3px solid #86a89a}
  #ask .msg.activity.failed{border-left-color:#c9866f}
  #ask .activityLabel{display:block;color:#b7c9bb;font-size:.62rem;margin-bottom:5px}
  #ask .msg .msgActions{display:flex;gap:9px;margin-top:5px}
  #ask .msgActions button{font:inherit;font-size:.65rem;padding:6px 8px;min-height:32px;
       color:#cdbb9f;background:transparent;border:1px solid #3a2f2a;border-radius:5px;cursor:pointer}
  #ask .msg .replyContext{display:block;color:#ad9a83;font-size:.65rem;
       border-left:2px solid #6b4a2a;padding-left:7px;margin-bottom:6px;overflow-wrap:anywhere}
  #convoReply{display:none;align-items:center;gap:8px;margin-top:8px;color:#cdbb9f;
       font-size:.7rem;overflow-wrap:anywhere}
  #ask.convo #convoReply.on{display:flex}
  #convoReplyText{flex:1;min-width:0}
  #convoReplyCancel{background:transparent;border:1px solid #6b4a2a;color:#e2cfa8;

  #ask.convo .box>p>*:first-child{margin-top:auto}

       text-align:center;padding:12px 4px;line-height:1.5}

       border:1px solid #6b4a2a;background:#241a15;color:#e2cfa8;cursor:pointer}

       font-family:inherit;font-size:.8rem;cursor:pointer}
  #ask u{display:block;text-decoration:none;color:#8a7a6a;font-size:.62rem;

  #ask button.mine.new b{color:#e2cfa8}

  #ask button.mine i{display:block;color:#8a7a6a;font-size:.66rem;font-style:italic}

       border:1px solid #6b4a2a;background:#241a15;color:#e2cfa8;font-family:inherit;
       font-size:.74rem;cursor:pointer}
  #dlg .act:active{background:#6b4a2a;color:#fff6e2}
  #tools button.holding{background:rgba(212,162,74,.34);border-color:#d4a24a}


button.mine.cold{opacity:.42;filter:saturate(.35);cursor:default}
button.mine.cold i{opacity:.9}

<body>
<div id="stage">
  <canvas id="c"></canvas>
  <h1 id="title">Commons</h1>
  <div id="bar">walk with the joystick (top right) &middot; tap a thing to read it &middot; &#9998; leaves a note</div>
  <div id="stick"><div class="nub"></div></div>
  <div id="pad">
    <b class="u" data-k="up">&#9650;</b><b class="l" data-k="left">&#9664;</b>
    <b class="c">&#9679;</b>
    <b class="r" data-k="right">&#9654;</b><b class="d" data-k="down">&#9660;</b>
  </div>
  <div id="tools">
    <button id="editorBtn" title="Admin's map table" style="display:none">&#9997;</button>
    <button id="keyBtn" title="sign another device" style="display:none">&#9906;</button>
    <button id="handBtn" title="put it down here" style="display:none">&#9995;</button>
    <button id="noteBtn" title="leave a note">&#9998;</button>
    <button id="sayBtn" title="say something here">&#128172;</button>
    <button id="verbBtn" title="speak a verb (try !help)">&#128220;</button>
    <button id="gardenBtn" title="the garden" style="display:none">&#127793;</button>
    <button id="forageBtn" title="gather from the wood floor" style="display:none">&#129717;</button>
    <button id="moonBtn" title="the moon">&#127764;</button>
  </div>
  <div id="legacy-activity-controls" hidden aria-hidden="true">
    <button id="mineBtn" title="your things" style="display:none">&#10022;</button>
    <button id="rodBtn" title="cast a line" style="display:none">&#127907;</button>
    <button id="huntBtn" title="hunt wild game" style="display:none">&#129420;</button>
    <button id="tameBtn" title="the wilds" style="display:none">&#128062;</button>
    <button id="bowBtn" title="loose an end" style="display:none">&#127993;</button>
  </div>
  
  <div id="dlg" aria-live="polite">
    <div class="dpanel">
      <div class="plate"><span class="floret"></span><b class="who"></b></div>
      <div class="sysorn"></div>
      <div class="dbody"><b class="dtitle"></b><span class="dtext"></span><i class="dfoot"></i></div>
      <div class="dnext"><span class="chev">&#187;&#187;&#187;</span><span class="covenant"></span></div>
      <span class="dx">&times;</span>
    </div>
    <div class="dacts"></div>
  </div>
  <div id="pic"><span class="x">&times;</span><img alt=""><div class="cap"></div></div>
  
  <input id="picFile" type="file" accept="image/*" style="display:none">
  <div id="ask"><div class="box">
    <h2 id="askT"></h2><p id="askP"></p>
    <input id="askI" maxlength="40" autocomplete="off"><textarea id="askX" maxlength="400"></textarea>
    <div class="row"><button id="askNo">never mind</button><button id="askYes" class="go">done</button></div>
    
    <div id="convoSay" role="status" aria-live="polite"></div>
    <div id="convoReply" role="status" aria-live="polite"><span id="convoReplyText"></span>
      <button id="convoReplyCancel" aria-label="cancel reply">cancel reply</button></div>
    
    <div id="convoBar">
      <div id="convoPortraitFrame" aria-label="current speaker">
        <img id="convoPortrait" alt="">
        <span id="convoPortraitMark" aria-hidden="true">?</span>
      </div>
      <select id="convoWho" aria-label="tag someone"><option value="">@ tag</option></select>
      <textarea id="convoX" rows="1" maxlength="20000"
                placeholder="say something here…"
                aria-label="say something in this room"></textarea>
      <button id="convoGo">say</button>
    </div>
  </div></div>
</div>

<script>

function loadImg(src, cb, priority){
  const im = new Image();
  if(priority)im.fetchPriority=priority;
  im.onload = function(){ cb(im); };
  im.onerror = function(){
    const local = src.indexOf(CDN) === 0 ? src.slice(CDN.length) : null;
    if(!local){ cb(null); return; }
    const j = new Image();
    if(priority)j.fetchPriority=priority;
    j.onload = function(){ cb(j); };
    j.onerror = function(){ cb(null); };
    j.src = local;
  };
  im.src = src;
}

function stepHere(){
  const now = Date.now()/1000;
  HERE.forEach(function(p){
    if(p.dx === undefined){ p.dx = p.x; p.dy = p.y; p.anim = 0; }
    p.live = !!(p.ts && (now - p.ts) < 15);
    const ax = p.x - p.dx, ay = p.y - p.dy, d = Math.sqrt(ax*ax + ay*ay);

    if(d > 12){
      p.dx = p.x; p.dy = p.y; p.walking = false; p.anim = 0;
    } else if(d > 0.06){
      const spd = Math.min(SPD*1.25, d);
      p.dx += ax/d*spd; p.dy += ay/d*spd;
      p.walking = true; p.anim = (p.anim||0) + 0.16;
      if(Math.abs(ax) > Math.abs(ay)) p.face = ax>0 ? 'right' : 'left';
      else                            p.face = ay>0 ? 'down'  : 'up';
    } else {
      p.walking = false; p.anim = 0; p.face = null;
    }
  });
}

const STICK = { x:0, y:0, active:false };
(function(){
  const el = document.getElementById('stick'), nub = el.querySelector('.nub');
  let pid = null;
  function setFrom(e){
    const b = el.getBoundingClientRect(), r = b.width/2;
    let vx = (e.clientX - (b.left+r)) / r, vy = (e.clientY - (b.top+r)) / r;
    const m = Math.sqrt(vx*vx+vy*vy);
    if(m > 1){ vx/=m; vy/=m; }

    if(m < 0.18){ vx=0; vy=0; }
    STICK.x=vx; STICK.y=vy;
    nub.style.transform = 'translate('+(vx*r*0.55)+'px,'+(vy*r*0.55)+'px)';
  }
  el.addEventListener('pointerdown', function(e){
    if(pid!==null || (e.pointerType==='mouse' && e.button!==0)) return;
    e.preventDefault(); el.setPointerCapture(e.pointerId); pid=e.pointerId;
    STICK.active=true; el.classList.add('live');
    TARGET=null; hideTip(); bar.classList.add('gone'); setFrom(e);
  });
  el.addEventListener('pointermove', function(e){ if(e.pointerId===pid) setFrom(e); });
  function release(e){
    if(e && pid!==null && e.pointerId!==pid) return;
    const previous=pid;
    pid=null; STICK.active=false; STICK.x=0; STICK.y=0;
    el.classList.remove('live'); nub.style.transform='';
    if(previous!==null && el.hasPointerCapture(previous)) el.releasePointerCapture(previous);
  }
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('lostpointercapture', release);
  addEventListener('blur', function(){release();TARGET=null;});
  document.addEventListener('visibilitychange', function(){if(document.hidden){release();keys={};TARGET=null;}});
  document.addEventListener('commons-pause', function(){release();keys={};TARGET=null;});
})();

function mapW(){ return R.rows[0].length*T; }
function mapH(){ return R.rows.length*T; }
function centreCam(snap){
  let fx,fy;
  if(mapW()<=VW) fx=(mapW()-VW)/2; else fx=clamp(P.x*T-VW/2,0,mapW()-VW);
  if(mapH()<=VH) fy=(mapH()-VH)/2; else fy=clamp(P.y*T-VH/2,0,mapH()-VH);
  if(snap){camX=fx;camY=fy;} else {camX+=(fx-camX)*0.12; camY+=(fy-camY)*0.12;}
}

function externalDoorURL(raw){
  if(!raw) return null;
  try{
    const u=new URL(raw,location.href);
    const local=u.protocol==='http:'&&(u.hostname==='localhost'||u.hostname==='127.0.0.1');
    return (u.protocol==='https:'||local)&&!u.username&&!u.password?u.href:null;
  }catch(_){return null;}
}
function doors(){
  if(TRAVELLING) return;
  const d=R.props.find(function(p){const b=CommonsGeometry.rect(p);return (p.to||p.href) && P.x>=b.x && P.x<=b.x+b.w && P.y>=b.y && P.y<=b.y+b.h;});
  if(!d) return;
  if(d.href){
    const href=externalDoorURL(d.href);

}

const SPD=0.115;
function step(){
  if(window.commonsField) window.commonsField.step();
  if(window.commonsAdventureOpen){P.moving=false;return;}
  let dx=0, dy=0;
  const held = keys.up||keys.down||keys.left||keys.right;
  const wantsMove = !(window.commonsField&&window.commonsField.busy()) && !!(held || (STICK.active && (STICK.x||STICK.y)) || TARGET);
  if(ACTION.name){


    if(wantsMove) stopAction();
    P.moving=false;
    stepAction();
    stepHere(); stepCompanions(); cloudStep(); rookStep();
    return;
  }
  if(window.commonsField&&window.commonsField.busy()){P.moving=false;return;}
  if(STICK.active && (STICK.x||STICK.y)){

    dx = STICK.x*SPD; dy = STICK.y*SPD;
  } else if(held){
    dx=(keys.right?SPD:0)-(keys.left?SPD:0); dy=(keys.down?SPD:0)-(keys.up?SPD:0);
    if(dx&&dy){ dx*=0.7071; dy*=0.7071; }
  } else if(TARGET){
    const ax=TARGET.x-P.x, ay=TARGET.y-P.y, d=Math.sqrt(ax*ax+ay*ay);
    if(d<0.12) TARGET=null; else { dx=ax/d*SPD; dy=ay/d*SPD; }
  }
  if(dx||dy){
    if(Math.abs(dx)>Math.abs(dy)) P.dir = dx>0?'right':'left'; else P.dir = dy>0?'down':'up';
  }
  let moved=false;
  const nx=P.x+dx; if(dx && !hits(nx,P.y)){ P.x=nx; moved=true; }
  const ny=P.y+dy; if(dy && !hits(P.x,ny)){ P.y=ny; moved=true; }
  P.moving = moved;
  if(moved) P.anim += 0.16; else P.anim = 0;
  if(TARGET){ stuck = moved?0:stuck+1; if(stuck>25){ TARGET=null; stuck=0; } }

  if(moved){ maybePostHere(false); _stepWasMoving = true; }
  else if(_stepWasMoving){ _stepWasMoving = false; maybePostHere(true); }
  stepHere();
  stepCompanions();
  cloudStep();
  rookStep();
  doors();
}

const ALF_BEAT   = 20;
const ALF_STAY   = 9;
const ALF_GIFT_N = 7;
const ALF_TALL   = 0.62;
const ALF_SHEEN  = '#4a4668';

const ALF_COAT   = '#141319', ALF_DARK = '#08080b', ALF_BEAKC = '#26242c';

let ALF_CAT = null;
let ALF_CLAIMED = {};
let ALF_GIFT = null;

function alfHash(n, salt){
  let h = 2166136261;
  const s = 'rook:' + salt + ':' + n;
  for(let i=0;i<s.length;i++){
    h = Math.imul(h ^ s.charCodeAt(i), 16777619) >>> 0;
  }

  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b) >>> 0;
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
}

function alfBeatNow(){ return Math.floor(Date.now()/1000/ALF_BEAT); }


function rookAt(beat){
  if(!ALF_CAT) return null;
  const rooms = ALF_CAT.rooms;
  const stint = Math.floor(beat / ALF_STAY);
  const k     = beat - stint*ALF_STAY;
  const room  = rooms[alfHash(stint,'room') % rooms.length];


  const fx = 0.12 + (alfHash(beat,'fx') % 1000)/1000 * 0.76;
  const fy = 0.14 + (alfHash(beat,'fy') % 1000)/1000 * 0.62;
  const roll = alfHash(beat,'act') % 100;
  let act = 'wander';
  if(roll < 44)      act = 'spy';
  else if(roll < 74) act = 'wander';
  else               act = 'perch';
  const gift = (k === ALF_STAY-1) && (alfHash(stint,'gift') % ALF_GIFT_N === 0);
  if(gift) act = 'gift';
  const names = Object.keys((ALF_CAT.shinies)||{});
  const shiny = names.length ? names[alfHash(beat,'shiny') % names.length] : null;
  return {beat:beat, stint:stint, k:k, room:room, fx:fx, fy:fy,
          act:act, gift:gift, shiny:shiny};
}

const ALF = {x:6, y:6, room:'', tx:6, ty:6, wing:0, act:'wander', dir:'south',
             beat:-1, watch:null, land:0};

function alfDirection(dx,dy){
  const a = Math.atan2(dy,dx) * 180 / Math.PI;
  if(a >= -22.5 && a < 22.5) return 'east';
  if(a >= 22.5 && a < 67.5) return 'south-east';
  if(a >= 67.5 && a < 112.5) return 'south';
  if(a >= 112.5 && a < 157.5) return 'south-west';
  if(a >= 157.5 || a < -157.5) return 'west';
  if(a >= -157.5 && a < -112.5) return 'north-west';
  if(a >= -112.5 && a < -67.5) return 'north';
  return 'north-east';
}

function alfSpyTarget(beat){
  const live = [];
  if(ME) live.push({name:ME, x:P.x, y:P.y});
  for(let i=0;i<HERE.length;i++){
    const p = HERE[i];
    if(String(p.name).toLowerCase() === String(ME||'').toLowerCase()) continue;
    live.push({name:p.name, x:(p.dx!==undefined?p.dx:p.x),
                            y:(p.dy!==undefined?p.dy:p.y)});
  }
  if(!live.length) return null;
  live.sort(function(a,b){ const A=String(a.name).toLowerCase(), B=String(b.name).toLowerCase();
                           return A<B?-1:(A>B?1:0); });
  return live[alfHash(beat,'spy') % live.length];
}

function rookStep(){
  const s = rookAt(alfBeatNow());
  if(!s) return;
  if(s.beat !== ALF.beat){          /* a new decision */
    const jumped = (s.room !== ALF.room);
    ALF.beat = s.beat; ALF.act = s.act;
    if(jumped){ ALF.room = s.room; }
    if(ALF.room === ROOM){
      const W = (R.rows[0]||'').length || 20, H = R.rows.length || 20;
      ALF.tx = Math.max(1, Math.min(W-2, s.fx * W));
      ALF.ty = Math.max(2, Math.min(H-2, s.fy * H));
      if(jumped){ ALF.x = ALF.tx; ALF.y = ALF.ty; }
      ALF.watch = (s.act === 'spy' || s.act === 'gift') ? alfSpyTarget(s.beat) : null;
      if(ALF.watch){   /* settle a beak-length off their shoulder, never on them */
        ALF.tx = ALF.watch.x + ((alfHash(s.beat,'side')%2) ? 1.35 : -1.35);
        ALF.ty = ALF.watch.y - 1.15;
      }
      if(s.gift) alfClaimGift(s);
    }
  }
  if(ALF.room !== ROOM) return;
  const dx = ALF.tx - ALF.x, dy = ALF.ty - ALF.y;
  const d = Math.sqrt(dx*dx + dy*dy);
  if(d > 0.06){
    ALF.dir = alfDirection(dx,dy);
    const sp = Math.min(0.19, d*0.16 + 0.02);
    ALF.x += dx/d*sp; ALF.y += dy/d*sp;
    ALF.wing += 0.42; ALF.land = 0;
  } else {
    ALF.land++;
    ALF.wing += (ALF.act === 'perch' && ALF.land > 14) ? 0 : 0.11;
  }
}
function alfFlying(){ return !(ALF.act === 'perch' && ALF.land > 14); }

function alfSettledHop(){
  if(ALF.act !== 'perch' || ALF.land <= 14 || ALF.beat < 0) return 0;
  const t = Date.now()/1000 - ALF.beat*ALF_BEAT;
  const start = 4 + (alfHash(ALF.beat,'hop') % 900)/100;
  const u = t - start;
  if(u < 0 || u > 0.48) return 0;
  return Math.sin((u/0.48)*Math.PI) * (ALF_TALL*T*CHARSCALE*0.16);
}

function alfClaimGift(s){
  if(!ME || ALF_CLAIMED[s.beat]) return;
  ALF_CLAIMED[s.beat] = 1;
  commonsWriteFetch('/api/rook', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({by:ME, key:MYKEY, beat:s.beat, room:ROOM})})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j && j.ok && j.shiny){
        ALF_GIFT = {shiny:j.shiny, line:j.line || '', t:Date.now()};
        if(typeof refreshBasket === 'function'){ try{ refreshBasket(); }catch(e){} }
      }
    }).catch(function(){});
}

  cx.fillStyle = ALF_EYE;
  cx.beginPath(); cx.arc(h*0.05, -h*0.03, Math.max(1, h*0.052), 0, 6.284); cx.fill();
  cx.restore();


  cx.fillStyle = ALF_COAT;
  cx.beginPath();
  cx.moveTo(0, -h*0.46);
  cx.quadraticCurveTo(-h*0.66, -h*0.50 - beat*h*0.62, -h*0.86, -h*0.20 - beat*h*0.34);
  cx.quadraticCurveTo(-h*0.46, -h*0.34, 0, -h*0.34);
  cx.closePath(); cx.fill();
  cx.strokeStyle = ALF_SHEEN; cx.globalAlpha = 0.40;
  cx.lineWidth = Math.max(1, h*0.05); cx.beginPath();

  cx.quadraticCurveTo(-h*0.60, -h*0.46 - beat*h*0.55, -h*0.82, -h*0.21 - beat*h*0.32);

function loadFolderAnim(name, done){
  if(!window.COMMONS_CONFIG.avatarNames.includes(name) && !globalThis.commonsAnimalSprites?.has(name)){done(null);return;}
  if(globalThis.commonsAnimalSprites?.has(name)){commonsAnimalSprites.load(name,done);return;}
  const base = CDN + 'art/anim/' + String(name).toLowerCase() + '/';


  FOLDER_ANIMS.load(base).then(done, function(){done(null);});
}

function loadJSON(url, cb){
  function ask(src, fallback){
   try{
    const x = new XMLHttpRequest();
    x.open('GET', src, true);
    x.onreadystatechange = function(){
      if(x.readyState !== 4) return;
      if(x.status >= 200 && x.status < 300){
        try{ cb(JSON.parse(x.responseText)); }catch(e){ cb(null); }
      } else if(fallback) ask(fallback, null);
      else cb(null);
    };
    x.send();
   }catch(e){ if(fallback) ask(fallback, null); else cb(null); }
  }

  const fallback = url.indexOf(CDN)===0 ? url.slice(CDN.length) : null;
  ask(url, fallback);
}

function drawFolderFrame(rec, dir, frameIdx, px, py, alpha){
  if(rec.atlas)return commonsAnimalSprites.draw(rec,dir,frameIdx,px,py,alpha);
  const list = rec.frames[dir] || rec.frames.down || [];
  if(!list.length) return false;
  const im = list[Math.min(frameIdx, list.length-1)] || list[0] || list.find(Boolean);
  if(!im) return false;
  const h = rec.tilesTall * T * CHARSCALE;
  const w = h * (im.width / im.height);
  cx.globalAlpha = (alpha===undefined ? 1 : alpha);
  cx.drawImage(im, Math.round(px - w/2), Math.round(py - h), w, h);
  cx.globalAlpha = 1;
  return true;
}

function actionFrameList(rec, name, dir){
  const spec=rec && rec.actions && rec.actions[String(name||'').toLowerCase()];
  if(!spec) return [];
  if(spec.files?.[dir])return spec.frames[dir]||[];
  return spec.frames[dir] || spec.frames.down || spec.frames.all || [];
}
function drawActionFrame(rec, name, dir, frameIdx, px, py, alpha){
  const list=actionFrameList(rec,name,dir);
  if(!list.length) return false;
  const im=list[Math.min(Math.max(0,frameIdx),list.length-1)];
  if(!im) return false;
  const h=rec.tilesTall*T*CHARSCALE, w=h*(im.width/im.height);
  cx.globalAlpha=(alpha===undefined?1:alpha);
  cx.drawImage(im,Math.round(px-w/2),Math.round(py-h),w,h);
  cx.globalAlpha=1;
  return true;
}
function finishAction(){
  const wasSit=ACTION.name==='sit';
  const done=ACTION.done;
  ACTION.name=null; ACTION.phase='idle'; ACTION.frame=0; ACTION.clock=0;
  ACTION.contact=null; ACTION.contactFired=false; ACTION.hold=false;
  ACTION.reverseWanted=false; ACTION.done=null;
  ACTION.serial=(ACTION.serial||0)+1;
  if(wasSit){globalThis.commonsSeats?.stand();maybePostHere(true);}
  if(done) done();
}
function beginActionReverse(){
  if(!ACTION.name) return;
  if(ACTION.phase==='loading'){finishAction();return;}
  if(ACTION.phase==='working'){ACTION.reverseWanted=true;return;}
  ACTION.reverseWanted=true;
  if(ACTION.phase==='hold') { ACTION.phase='reverse'; ACTION.clock=0; }
}
function stopAction(){ beginActionReverse(); }
function fireActionContact(){
  if(ACTION.contactFired) return;
  ACTION.contactFired=true;
  const serial=ACTION.serial;
  let work=null;
  try{ work=ACTION.contact ? ACTION.contact() : null; }
  catch(e){ beginActionReverse(); throw e; }
  if(work && typeof work.then==='function'){
    ACTION.phase='hold';
    work.then(function(){ if(ACTION.serial===serial&&!ACTION.hold) beginActionReverse(); },
              function(){ if(ACTION.serial===serial&&!ACTION.hold) beginActionReverse(); });
  } else if(ACTION.hold && !ACTION.reverseWanted){ ACTION.phase='hold'; }
  else beginActionReverse();
}
function stepAction(){
  if(!ACTION.name) return;
  if(ACTION.phase==='loading'||ACTION.phase==='working')return;
  const rec=MYAVATAR ? ANIM[MYAVATAR] : null;
  const list=actionFrameList(rec,ACTION.name,P.dir);
  if(!list.length){ finishAction(); return; }
  if(ACTION.phase==='hold'){
    if(ACTION.reverseWanted){ ACTION.phase='reverse'; ACTION.clock=0; }
    return;
  }
  ACTION.clock += ACTION.fps/60;
  while(ACTION.clock>=1 && ACTION.name){
    ACTION.clock-=1;
    if(ACTION.phase==='forward'){
      if(ACTION.frame < list.length-1) ACTION.frame++;
      if(ACTION.frame >= list.length-1) fireActionContact();
    } else if(ACTION.phase==='reverse'){
      if(ACTION.frame>0) ACTION.frame--;
      else finishAction();
    }
  }
}
function playAction(name, opts){
  opts=opts||{};
  const rec=MYAVATAR ? ANIM[MYAVATAR] : null;
  const key=String(name||'').toLowerCase();
  const spec=rec && rec.actions && rec.actions[key];
  const list=actionFrameList(rec,key,P.dir);


  if(!spec || (!list.length&&!rec.ensureAction)){
    let work=null;
    try{ work=opts.contact ? opts.contact() : null; }
    finally{ if(opts.done) Promise.resolve(work).then(opts.done,opts.done); }
    return false;
  }
  if(ACTION.name) finishAction();
  TARGET=null; P.moving=false; P.anim=0;
  ACTION.name=key; ACTION.phase='forward'; ACTION.frame=0; ACTION.clock=0;
  ACTION.fps=Number(opts.fps)||spec.fps||8;
  ACTION.contact=opts.contact||null; ACTION.contactFired=false;
  ACTION.hold=(opts.hold===undefined ? !!spec.hold : !!opts.hold);
  ACTION.reverseWanted=false; ACTION.done=opts.done||null;
  if(!list.length){
    ACTION.phase='loading';
    const serial=ACTION.serial,avatar=MYAVATAR,dir=P.dir,x=P.x,y=P.y;
    rec.ensureAction(key,dir).then(function(ready){
      if(ACTION.serial!==serial||ACTION.name!==key||MYAVATAR!==avatar)return;
      if(P.x!==x||P.y!==y){finishAction();return;}
      if(!ready){

        ACTION.phase='working';
        ACTION.contactFired=true;
        let work;
        try{work=ACTION.contact?ACTION.contact():null;}catch(_){finishAction();return;}
        const complete=function(){if(ACTION.serial===serial&&ACTION.name===key)finishAction();};
        Promise.resolve(work).then(complete,complete);
        return;
      }
      ACTION.phase='forward';
      if(key==='sit')maybePostHere(true);
    });
  }else if(key==='sit') maybePostHere(true);
  return true;
}
function drawAvatar(){

let COMPANION_BOOK = {companions:[], mine:[]};
const COMPANION_HEARTS = CommonsCompanionAffection.create({reducedMotion:!!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches});
const WITNESSED_PETS = new Map();
let COMPANION_BOOK_READY = false;
const FOLLOWERS = {};
const COMPANION_NEAR = 1.05;
const COMPANION_FAR = 14;
const COMPANION_SPD = SPD * 0.92;

function companionAnimName(animal){
  let slug=String(animal||'').toLowerCase().replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
  slug=({'wild-hare':'rabbit','hare':'rabbit','red-deer':'deer',
         'wild-boar':'boar','black-grouse':'grouse'})[slug]||slug;
  return slug ? 'animal-'+slug : '';
}
function companionHasArt(name){


  return /^animal-(rabbit|deer|boar|grouse|wolf|bear)$/.test(name)||!!window.commonsAnimalSprites?.has(name);
}

function companionInstance(c){return String(c?.instance_id||c?.id||'');}
function companionOwnerKey(value){return String(value||'').trim().toLowerCase().slice(0,40);}
function companionHeartAnchor(identity){
  const id=companionInstance(identity);
  const record=(COMPANION_BOOK.companions||[]).find(c=>companionInstance(c)===id);
  if((identity.family_body||record?.family_body)==='cloud'){
    return NIM.room===ROOM?{x:NIM.x,y:NIM.y-NIM_TALL*CHARSCALE-.15}:null;
  }
  const f=FOLLOWERS[id];
  if(!companionVisible(f))return null;
  const rec=ANIM[companionAnimName(f.rec.animal)];
  return {x:f.x,y:f.y-(rec?.tilesTall||.9)*CHARSCALE-.15};
}
function companionScreenAnchor(identity){
  const anchor=companionHeartAnchor(identity);if(!anchor)return null;
  const x=anchor.x*T-Math.round(camX),y=anchor.y*T-Math.round(camY);
  return x>=0&&x<=VW&&y>=0&&y<=VH?anchor:null;
}
function witnessCompanionPets(rows){
  const now=Date.now()/1000;
  for(const c of rows||[]){
    const event=c.last_pet||c.game?.last_pet;if(!event?.id)continue;
    const key=companionInstance(c)+':'+event.id;
    if(WITNESSED_PETS.has(key))continue;
    WITNESSED_PETS.set(key,true);
    if(COMPANION_BOOK_READY&&now-Number(event.time)>=-2&&now-Number(event.time)<=8){
      const identity={instance_id:companionInstance(c),name:c.given_name||c.game?.custom_name||c.animal,family_body:c.family_body||null};
      COMPANION_HEARTS.add(identity,()=>companionScreenAnchor(identity),event.id);
    }
  }
  while(WITNESSED_PETS.size>128)WITNESSED_PETS.delete(WITNESSED_PETS.keys().next().value);
  COMPANION_BOOK_READY=true;
}

function syncCompanionFollowers(rows){
  const keep={};
  (rows||[]).forEach(function(c){
    if(!c || !companionInstance(c) || !c.following) return;


    if(c.family_body==='cloud') return;
    const id=companionInstance(c);keep[id]=true;
    let f=FOLLOWERS[id];
    if(!f){
      f=FOLLOWERS[id]={id, rec:c, x:0, y:0, room:null,
        dir:'down', anim:0, moving:false};
    } else f.rec=c;
    const key=companionAnimName(c.animal);
    if(key && companionHasArt(key) && ANIM[key]===undefined){
      ANIM[key]=null;
      loadFolderAnim(key,function(rec){ ANIM[key]=rec; });
    }
  });
  Object.keys(FOLLOWERS).forEach(function(id){ if(!keep[id]) delete FOLLOWERS[id]; });
}

function companionLeaderSpot(c){
  const owner=companionOwnerKey(c.owner);
  if(owner && owner===companionOwnerKey(ME)){
    return {room:ROOM,x:P.x,y:P.y,dir:P.dir,live:true};
  }
  for(let i=0;i<HERE.length;i++){
    const p=HERE[i];
    if(companionOwnerKey(p.name)!==owner) continue;
    return {room:ROOM,x:(p.dx!==undefined?p.dx:p.x),
      y:(p.dy!==undefined?p.dy:p.y),dir:(p.face||p.facing||'down'),live:!!p.live};
  }
  return null;
}

function companionSolid(x,yFeet){
  for(let tx=Math.floor(x-0.28);tx<=Math.ceil(x+0.28)-1;tx++)
    for(let ty=Math.floor(yFeet-0.48);ty<=Math.ceil(yFeet)-1;ty++)
      if(solid(tx,ty)) return true;
  return false;
}

function stepCompanions(){
  Object.keys(FOLLOWERS).forEach(function(id){
    const f=FOLLOWERS[id], L=companionLeaderSpot(f.rec);
    if(!L){ f.moving=false; return; }
    if(f.room!==L.room){
      f.room=L.room; f.x=L.x-0.7; f.y=L.y+0.35;
      f.dir=L.dir; f.anim=0; f.moving=false;
    }
    if(f.room!==ROOM){ f.moving=false; return; }
    let ax=L.x-f.x, ay=L.y-f.y, d=Math.sqrt(ax*ax+ay*ay);
    if(d>COMPANION_FAR){
      f.x=L.x-0.7; f.y=L.y+0.35; f.moving=false; f.anim=0; return;
    }
    if(d>COMPANION_NEAR){
      const sp=Math.min(COMPANION_SPD,d-COMPANION_NEAR*0.55);
      const nx=f.x+ax/d*sp, ny=f.y+ay/d*sp;
      let moved=false;
      if(!companionSolid(nx,f.y)){f.x=nx;moved=true;}
      if(!companionSolid(f.x,ny)){f.y=ny;moved=true;}
      f.moving=moved;
      if(moved){
        f.anim+=0.18;
        if(Math.abs(ax)>Math.abs(ay)) f.dir=ax>0?'right':'left';
        else                         f.dir=ay>0?'down':'up';
      }
    } else { f.moving=false; f.anim=0; f.dir=L.dir||f.dir; }
  });
}

function companionVisible(f){
  return f && f.room===ROOM && !!companionLeaderSpot(f.rec);
}

function companionAt(point,ownedOnly=false){
  const candidates=Object.values(FOLLOWERS).filter(companionVisible).map(f=>({record:f.rec,x:f.x,y:f.y,
    height:(ANIM[companionAnimName(f.rec.animal)]?.tilesTall||.9)*CHARSCALE}));
  if(NIM.room===ROOM){
    const record=(window.commonsAdventureState?.family_pets||[]).find(c=>c.family_body==='cloud')||
      (COMPANION_BOOK.companions||[]).find(c=>c.family_body==='cloud');
    candidates.push({record:record||{family_body:'cloud',given_name:'Cloud',owner:'Admin'},x:NIM.x,y:NIM.y,height:NIM_TALL*CHARSCALE});
  }
  return candidates.filter(c=>(!ownedOnly||companionOwnerKey(c.record.owner|| (c.record.is_family_pet?'Admin':''))===companionOwnerKey(ME))&&
    Math.abs(point.x-c.x)<.65&&point.y<=c.y+.2&&point.y>=c.y-c.height)
    .sort((a,b)=>Math.abs(point.x-a.x)-Math.abs(point.x-b.x))[0];
}
function tapOwnedCompanion(point){
  if(!window.commonsGame?.pet)return false;
  const hit=companionAt(point,true);
  if(!hit)return false;
  hideTip();TARGET=null;
  window.commonsGame.pet({instance_id:companionInstance(hit.record),family_body:hit.record.family_body||null,
    name:hit.record.given_name||hit.record.custom_name||hit.record.name||hit.record.animal||'Cloud'});

function tapCompanionInfo(point){

  showTip(hit.record.given_name||hit.record.animal||'Cloud',
    'Walking with '+(hit.record.owner||'their person')+'. Their owner can feed and care for them.', '',undefined,undefined);

function drawCompanion(f){

    if(glyph){cx.font='30px "Segoe UI Emoji", sans-serif';cx.textAlign='center';cx.fillText(glyph,px,py);}
    else{cx.fillStyle=f.rec.colour||'#8a7355';
    cx.beginPath();cx.ellipse(px,py-T*.36,T*.25,T*.32,0,0,6.3);cx.fill();
    cx.beginPath();cx.arc(px,py-T*.68,T*.17,0,6.3);cx.fill();}
  }

const NIM_HOME  = {room:'', x:10, y:20};
const NIM_SPD   = SPD * 1.16;
const NIM_NEAR  = 1.30;
const NIM_FAR   = 16;
const NIM_LIVE  = 60;
const NIM_LIE_HEEL = 2400;

const NIM_LIE_HOME = 150;

const NIM_LIE   = NIM_LIE_HEEL;
const NIM_TALL  = 1.28;
const NIM = {x:NIM_HOME.x, y:NIM_HOME.y, dir:'down', anim:0, moving:false,
             idle:NIM_LIE, room:NIM_HOME.room, leader:null, lead:null};


if(ANIM['cloud'] === undefined){
  ANIM['cloud'] = null;
  loadFolderAnim('cloud', function(rec){ ANIM['cloud'] = rec; });
}

function nimRim(cxx, cyy, rx, ry, from, to, w, a){
  cx.save();
  cx.strokeStyle = NIM_RIM; cx.globalAlpha = (a === undefined ? 0.55 : a);
  cx.lineWidth = w; cx.lineCap = 'round';
  cx.beginPath(); cx.ellipse(cxx, cyy, rx, ry, 0, from, to); cx.stroke();
  cx.restore();
}

function nimSolid(x, yFeet){
  for(let tx=Math.floor(x-0.45); tx<=Math.ceil(x+0.45)-1; tx++)
    for(let ty=Math.floor(yFeet-0.7); ty<=Math.ceil(yFeet)-1; ty++)
      if(solid(tx,ty)) return true;
  return false;
}

const NIM_ORDER = [];
function cloudLeader(){
  const now = Date.now()/1000;
  const live = [];


  if(ME) live.push({name:ME, key:companionOwnerKey(ME),
                    room:ROOM, x:P.x, y:P.y, mine:true});
  Object.keys(ALLHERE||{}).forEach(function(n){
    const r = ALLHERE[n];
    if(!r || !r.room) return;
    if(companionOwnerKey(n) === companionOwnerKey(ME)) return;
    if(!(r.ts && (now - r.ts) < NIM_LIVE)) return;
    live.push({name:n, key:companionOwnerKey(n),
               room:r.room, x:r.x, y:r.y, mine:false});
  });
  if(!live.length) return null;
  live.sort(function(a,b){
    const ai = NIM_ORDER.indexOf(a.key), bi = NIM_ORDER.indexOf(b.key);
    const av = ai<0 ? 99 : ai, bv = bi<0 ? 99 : bi;
    if(av !== bv) return av - bv;
    return a.key < b.key ? -1 : (a.key > b.key ? 1 : 0);
  });
  return live[0];
}

function cloudLeaderSpot(L){
  if(L.mine) return {x:P.x, y:P.y};
  for(let i=0;i<HERE.length;i++){
    const p = HERE[i];
    if(String(p.name).toLowerCase() !== L.key) continue;

    return {x:(p.dx!==undefined?p.dx:p.x), y:(p.dy!==undefined?p.dy:p.y)};
  }
  return {x:L.x, y:L.y};
}

function cloudStep(){
  return; // Public worlds start without a pre-owned family pet.
  const L = cloudLeader();

  const wasWith = NIM.leader;
  const nowWith = L ? L.name : null;
  if(wasWith !== nowWith) NIM.idle = 0;
  NIM.lead = L;
  NIM.leader = nowWith;
  const room = L ? L.room : NIM_HOME.room;
  if(room !== NIM.room){        // he went through a door with them
    NIM.room = room;
    if(L){ const s0 = cloudLeaderSpot(L); NIM.x = s0.x; NIM.y = s0.y + 0.9; }
    else { NIM.x = NIM_HOME.x; NIM.y = NIM_HOME.y; }
  }
  if(NIM.room !== ROOM){ NIM.moving = false; return; }

  const goal = L ? cloudLeaderSpot(L) : {x:NIM_HOME.x, y:NIM_HOME.y};
  const stop = L ? NIM_NEAR : 0.25;
  let ax = goal.x - NIM.x, ay = goal.y - NIM.y;
  const d = Math.sqrt(ax*ax + ay*ay);

  if(d > NIM_FAR){              /* stranded: cut the corner, never sulk */
    NIM.x = goal.x; NIM.y = goal.y + 0.9; NIM.moving = false; NIM.idle = 0;
    return;
  }
  if(d > stop){
    const sp = Math.min(NIM_SPD, d - stop*0.5);
    const nx = NIM.x + ax/d*sp, ny = NIM.y + ay/d*sp;
    let moved = false;
    if(!nimSolid(nx, NIM.y)){ NIM.x = nx; moved = true; }
    if(!nimSolid(NIM.x, ny)){ NIM.y = ny; moved = true; }
    NIM.moving = moved;
    if(moved){
      NIM.anim += 0.20; NIM.idle = 0;
      if(Math.abs(ax) > Math.abs(ay)) NIM.dir = ax>0 ? 'right' : 'left';
      else                            NIM.dir = ay>0 ? 'down'  : 'up';
    } else { NIM.idle++; }
  } else {
    NIM.moving = false; NIM.anim = 0; NIM.idle++;
    if(L && NIM.idle < NIM_LIE_HEEL){   /* standing guard: he watches them */
      if(Math.abs(ax) > Math.abs(ay)) NIM.dir = ax>0 ? 'right' : 'left';
      else                            NIM.dir = ay>0 ? 'down'  : 'up';
    }
  }
}

function cloudLying(){
  if(NIM.moving) return false;
  return NIM.idle >= (NIM.lead ? NIM_LIE_HEEL : NIM_LIE_HOME);
}

const NIM_RIM   = '#8f8aa0';

function nimLeg(x, ytop, ylen, w, swing, col){
  cx.save(); cx.translate(x, ytop); cx.rotate(swing);
  cx.fillStyle = col;
  cx.beginPath();
  cx.moveTo(-w/2, 0); cx.lineTo(w/2, 0);
  cx.lineTo(w*0.34, ylen*0.62); cx.lineTo(w*0.30, ylen);
  cx.lineTo(-w*0.30, ylen); cx.lineTo(-w*0.34, ylen*0.62);
  cx.closePath(); cx.fill();
  cx.beginPath(); cx.ellipse(0, ylen, w*0.52, w*0.32, 0, 0, 6.3); cx.fill();
  cx.restore();
}

  cx.lineTo(hx + f*h*0.40, hy+h*0.045);
  cx.lineTo(hx + f*h*0.39, hy+h*0.090);
  cx.lineTo(hx + f*h*0.03, hy+h*0.130);
  cx.closePath(); cx.fill();
  cx.fillStyle = NIM_UNDER; cx.globalAlpha = .34;
  cx.beginPath();
  cx.moveTo(hx + f*h*0.05, hy+h*0.075);
  cx.lineTo(hx + f*h*0.37, hy+h*0.078);
  cx.lineTo(hx + f*h*0.03, hy+h*0.128);
  cx.closePath(); cx.fill();
  cx.globalAlpha = 1;
  cx.fillStyle = NIM_COAT;
  cx.beginPath();
  cx.moveTo(hx + f*h*0.02, hy-h*0.12); cx.lineTo(hx + f*h*0.12, hy-h*0.36);
  cx.lineTo(hx + f*h*0.19, hy-h*0.09); cx.closePath(); cx.fill();
  cx.fillStyle = NIM_EYE;
  cx.beginPath();
  cx.ellipse(hx + f*h*0.10, hy-h*0.010, h*0.036, h*0.024, f*0.18, 0, 6.3);

const BUBBLE_TTL_MS = 40000;
let MYSAY = null;
function _bubbleFor(p){
  const t = (p.says || '').toString();
  if(!t) return null;
  const age = Date.now() - (p.says_ts || 0) * 1000;
  if(age < 0 || age > BUBBLE_TTL_MS) return null;
  return {text: t, fade: Math.min(1, (BUBBLE_TTL_MS - age) / 2500)};
}
function drawBubble(x, y, text, fade, who){
  const PAD = 7, LH = 15, MAXW = 190;
  cx.save();
  cx.font = '13px Georgia, serif';

  const words = String(text).split(/\s+/); const lines = []; let cur = '';
  words.forEach(function(w){
    const t = cur ? cur + ' ' + w : w;
    if(cx.measureText(t).width > MAXW && cur){ lines.push(cur); cur = w; }
    else cur = t;
  });
  if(cur) lines.push(cur);
  const shown = lines.slice(0, 4);
  if(lines.length > 4) shown[3] = shown[3].replace(/.{2}$/, '\u2026');
  const w = Math.max.apply(null, shown.map(function(l){
              return cx.measureText(l).width; })) + PAD * 2;
  const h = shown.length * LH + PAD * 2;

  const EDGE = 8;
  let bx = Math.round(x - w / 2), by = Math.round(y - h - 10);
  if(w + EDGE * 2 <= VW) bx = Math.round(clamp(bx, camX + EDGE, camX + VW - w - EDGE));
  else bx = Math.round(camX + EDGE);
  if(by < camY + EDGE) by = Math.round(camY + EDGE);

  const tail = clamp(x, bx + 14, bx + w - 14);
  cx.globalAlpha = 0.96 * fade;
  cx.fillStyle = '#FBF4E4';
  cx.strokeStyle = (typeof SPEAKER_COLOUR !== 'undefined' && who &&
                    SPEAKER_COLOUR[String(who).toLowerCase()]) || '#B89A6A';
  cx.lineWidth = 1.6;
  const r = 8;
  cx.beginPath();
  cx.moveTo(bx + r, by);
  cx.arcTo(bx + w, by, bx + w, by + h, r);
  cx.arcTo(bx + w, by + h, bx, by + h, r);
  cx.lineTo(tail + 6, by + h); cx.lineTo(tail, by + h + 7);
  cx.lineTo(tail - 6, by + h);
  cx.arcTo(bx, by + h, bx, by, r);
  cx.arcTo(bx, by, bx + w, by, r);
  cx.closePath();
  cx.fill(); cx.stroke();
  cx.fillStyle = '#2B241B';
  cx.textAlign = 'left'; cx.textBaseline = 'top';
  shown.forEach(function(l, i){ cx.fillText(l, bx + PAD, by + PAD + i * LH); });
  cx.restore();
}
function drawBubbles(){
  HERE.forEach(function(p){
    const b = _bubbleFor(p);
    if(!b) return;
    const X = (p.dx !== undefined ? p.dx : p.x) * T;
    const Y = (p.dy !== undefined ? p.dy : p.y) * T;


    const prec = ANIM[String(p.name).toLowerCase()];
    const up = prec ? prec.tilesTall * T * CHARSCALE : FOOT * CHARSCALE;
    drawBubble(X, Y - up - 14, b.text, b.fade, p.name);
  });
  const mine = MYSAY && _bubbleFor(MYSAY);
  if(mine){
    const mp = ANIM[String(ME || '').toLowerCase()];
    const mup = mp ? mp.tilesTall * T * CHARSCALE : FOOT * CHARSCALE;
    drawBubble(P.x * T, P.y * T - mup - 14, mine.text, mine.fade, ME);
  }
}

 }catch(err){

    GROW.forEach(function(g){ const d=Math.abs(g.x-w.x)+Math.abs(g.y-w.y); if(d<pd){pd=d; pb=g;} });

      if(Math.abs(P.x-pb.x)+Math.abs(P.y-pb.y) <= 1.6){ plantCard(pb); return; }
      hideTip(); TARGET={x:pb.x, y:pb.y+0.6}; stuck=0;
      bar.textContent='walking to the '+(pb.crop||'plant')+'… tap it again when you arrive';
      bar.classList.remove('gone');
      return;
    }
  }
  const t = PLACE.reduce(function(best,o){
    if(!(w.x>=o.x && w.x<=o.x+(o.w||1) && w.y<=o.y+1 && w.y>=o.y+1-(o.h||1))) return best;
    const a=(o.w||1)*(o.h||1);
    return (!best || a < (best.w||1)*(best.h||1)) ? o : best;
  }, null);
  if(t){


    let foot = (MINE(t)?'yours':(t.owner+"'s")) + '  ·  ' +
               (t.fixed ? 'stays right here' : 'left here ' + (t.at||''));

    if(t.art && !sprites['@'+t.id]){
      foot += '  ·  drop ' + t.art.split('/').slice(-2).join('/') + ' and it draws itself';
    }

    let act = null;
    if(t.made_id){
      act=[];
      if(ME && Number(t.uses_left)>0)
        act.push({label:t.use_label||'use it', go:function(){ useMade(t.made_id); }});
      if(MINE(t) && !t.fixed)
        act.push({label:'pick it up', go:function(){ pickUp(t); }});
      if(t.uses_total){
        foot += '  \u00b7  '+t.uses_left+' of '+t.uses_total+' '+
                madeUnit(t,t.uses_left)+' left';
      }
    }
    else if(MINE(t) && !t.fixed) act = {label:'pick it up', go:function(){ pickUp(t); }};
    else if(MINE(t) && t.faces){
      const order = Object.keys(t.faces);
      const now = order.find(function(k){ return t.art===t.faces[k]; }) || order[0];
      const next = order[(order.indexOf(now)+1) % order.length];
      act = [{label:'she is '+now+' \u2014 make her '+next, go:function(){ setFace(t, next); }},


             {label:'the nest lock \u2014 set or clear today\u2019s password',
              go:function(){ lockFlow('nest'); }}];
    }
    showTip(t.label, t.note||'', foot, pt.clientX, pt.clientY, act);
    return;
  }

  if(window.commonsField && window.commonsField.tap(w)) return;
  const hit = R.props.reduce(function(best,p){
    if(p.to) return best;
    if(!(w.x>=p.x && w.x<=p.x+(p.w||1) && w.y<=p.y+1 && w.y>=p.y+1-(p.h||1))) return best;
    const a=(p.w||1)*(p.h||1);
    return (!best || a < (best.w||1)*(best.h||1)) ? p : best;
  }, null);
  if(hit){
    if(hit.game_npc&&window.commonsGame){hideTip();window.commonsGame.people();return;}
    if(hit.game_terminal&&window.commonsGame?.terminal){hideTip();window.commonsGame.terminal(hit.game_terminal);return;}


    const acts=[];
    if(WRITING_DESKS[ROOM+'/'+hit.id])
      acts.push({label:'read the pack\u2019s desk', go:function(){ deskPanel(); }});
    if(ROOM==='archive' && hit.id==='card-catalogue')
      acts.push({label:'read the seasonal archive', go:function(){ seasonalArchiveFlow(); }});
    if(ROOM==='closet' && hit.wardrobe)
      acts.push({label:'change your clothes', go:function(){ wardrobeFlow(); }});
    if(hit.action && String(hit.action.name||hit.action).toLowerCase()==='sit'){
      acts.push({label:hit.action.label||'sit here',go:()=>commonsSeats.sit(hit)});
    }
    showTip(hit.label, hit.note||'', 'placed by '+(hit.by||'?')+' · '+(hit.placed||''),
            pt.clientX, pt.clientY, acts.length?acts:null); return; }
  hideTip(); TARGET={x:w.x,y:w.y}; stuck=0; bar.classList.add('gone');
}

function shrink(file, done){
  const rd=new FileReader();
  rd.onload=function(){
    const im=new Image();
    im.onload=function(){
      const M=1280, s=Math.min(1, M/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      done(c.toDataURL('image/jpeg',0.82));
    };
    im.onerror=function(){ alert('could not read that picture'); };
    im.src=rd.result;
  };
  rd.onerror=function(){ alert('could not read that picture'); };
  rd.readAsDataURL(file);
}

function convoPortraitRecord(manifest, name){
  const all=(manifest&&manifest.portraits)||{}, key=String(name||'').toLowerCase();
  return Object.keys(all).reduce(function(found,k){
    return found || (k.toLowerCase()===key ? all[k] : null);
  },null);
}
function convoPortraitMood(state, name){
  const all=(state&&state.identities)||{}, key=String(name||'').toLowerCase();
  const row=Object.keys(all).reduce(function(found,k){
    return found || (k.toLowerCase()===key ? all[k] : null);
  },null);
  return String((row&&row.mood)||'').split(',')[0].trim().toLowerCase()
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
function convoPortraitSet(name){
  const who=String(name||'').trim(), key=who.toLowerCase();
  const accent=SPEAKER_COLOUR[key]||DLG_DEFAULT_COLOUR;
  convoPortraitFrame.style.setProperty('--convo-accent',accent);
  convoPortraitFrame.classList.remove('has-portrait');
  convoPortrait.removeAttribute('src');
  convoPortrait.alt=who ? who+' portrait' : '';
  convoPortraitMark.textContent=(who.charAt(0)||'?').toUpperCase();
  CONVO_PORTRAIT={identity:who,mood:'',source:'marker'};
  if(!who || !HEARTH_HUB) return Promise.resolve(CONVO_PORTRAIT);

  return Promise.all([
    fetch(PORTRAIT_CDN+'portraits/manifest.json?t='+Date.now())
      .then(function(r){if(!r.ok)throw new Error('manifest '+r.status);return r.json();}),
    fetch(HEARTH_HUB+'/api/sanctuary/state?t='+Date.now())
      .then(function(r){if(!r.ok)throw new Error('state '+r.status);return r.json();})
      .catch(function(){return null;})
  ]).then(function(pair){
    const rec=convoPortraitRecord(pair[0],who), moods=(rec&&rec.moods)||{};
    if(!Object.keys(moods).length) return CONVO_PORTRAIT;
    const liveMood=convoPortraitMood(pair[1],who);
    const chosen=(liveMood&&moods[liveMood]&&liveMood)
      || (moods.content&&'content') || (moods.thinking&&'thinking')
      || Object.keys(moods)[0];
    const path=moods[chosen];
    return new Promise(function(resolve){
      convoPortrait.onload=function(){
        convoPortraitFrame.classList.add('has-portrait');
        CONVO_PORTRAIT={identity:who,mood:chosen,source:'manifest',path:path};
        resolve(CONVO_PORTRAIT);
      };
      convoPortrait.onerror=function(){
        convoPortraitFrame.classList.remove('has-portrait');
        CONVO_PORTRAIT={identity:who,mood:'',source:'marker'};
        resolve(CONVO_PORTRAIT);
      };
      convoPortrait.src=PORTRAIT_CDN+path;
    });
  }).catch(function(){ return CONVO_PORTRAIT; });
}

function convoRow(l){

  const activity = l.kind === 'activity', id = Number(l.id);
  const icons = {fish:'🐟',keep:'🐟',release:'🐟',hunt:'🏹',archery:'🏹',loose:'🏹',gather:'⛏',forage:'🌿',

    'companion-follow':'🐾','companion-rest':'💤',feed:'🐾',tame:'🐾',hack:'⌨',plant:'🌱',
    tend:'🌱',harvest:'🌾',equip:'🧥',unequip:'🧥',use:'🍲',arrive:'🚪',
    'goal-pin':'🧭','goal-clear':'🧭','field-guide-title':'📖','project-contribute':'🤝','project-withdraw':'🤝','project-service':'🍽️',
    'dungeon-pause':'⏸️','dungeon-resume':'▶️','dungeon-away':'🛏️','dungeon-return':'👋',
    'companion-track':'🐾','companion-scout':'🦉','companion-forage':'🌿','companion-befriend':'💛','companion-diagnose':'🛠️'};
  const labels = {success:'succeeded',failure:'unsuccessful',pending:'in progress',complete:'completed'};
  const parent = CONVO_LINES.find(function(row){return row.id === l.reply_to;});
  const context = l.reply_to ? (parent ? 'Reply to '+String(parent.by||'')+': '+
    String(parent.display_text||parent.text||'').slice(0,160) : 'Reply to an earlier line') : '';

           (labels[l.outcome] ? ' · '+labels[l.outcome] : '')+'</span>' : '') +
         (context ? '<span class="replyContext">'+esc(context)+'</span>' : '') +

         (ME && Number.isSafeInteger(id) && id>0 ? '<div class="msgActions"><button data-reply="'+id+'">reply</button>'+
          (mine ? '<button data-unsay="'+id+'">take it back</button>' : '')+'</div>' : '')+'</article>';

function convoReplyTo(id){

function convoNote(msg){

}
function convoHush(){ convoSay.classList.remove('on'); convoSay.textContent = ''; }
function convoSig(d){
  const l = (d && d.lines) || [];
  return (d && d.closed ? 'shut:' : '') + l.length + ':' + (l.length ? l[l.length-1].id : 0);
}
function convoMentions(rows){
  rows=rows||[];
  const sig=rows.map(function(r){return r.id+':'+r.name;}).join('|');
  if(sig===CONVO_MENTION_SIG) return;
  CONVO_MENTION_SIG=sig;
  while(convoWho.options.length>1) convoWho.remove(1);
  rows.forEach(function(r){
    const o=document.createElement('option');


    o.value=String(r.name||''); o.textContent='@'+String(r.name||'');
    convoWho.appendChild(o);
  });
}
function convoRender(d, keepScroll){
  const atBottom = askP.scrollHeight - askP.scrollTop - askP.clientHeight < 40;
  const lines = (d && d.lines) || [];
  CONVO_LINES = lines;
  CONVO_CLOSED = !!(d && d.closed);
  askP.innerHTML = CONVO_CLOSED
    ? '<div class="convoRest">this room keeps its own counsel<br>' + esc(d.why || '') + '</div>'
    : (lines.length
        ? lines.map(convoRow).join('')
        : '<div class="convoRest">nobody has said anything in here yet<br>be the first \u2014 it stays</div>');
  convoX.disabled = CONVO_CLOSED; convoGo.disabled = CONVO_CLOSED;
  convoWho.disabled = CONVO_CLOSED;
  Array.prototype.forEach.call(askP.querySelectorAll('[data-unsay]'), function(bt){

  });

  });
  if(CONVO_REPLY && !lines.some(function(line){return line.id===CONVO_REPLY;})) convoReplyTo(null);

function convoLoad(quiet){
  return fetch('/api/chat?room=' + encodeURIComponent(ROOM) +
               '&as=' + encodeURIComponent(ME) +
               '&key=' + encodeURIComponent(MYKEY) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      convoMentions(d.mentions);
      const sig = convoSig(d);


      if(quiet && sig === CONVO_SIG) return;
      CONVO_SIG = sig; convoRender(d, quiet);

function convoUnsay(id, bt){
  fetch('/api/unsay', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({by:ME, key:MYKEY, room:ROOM, id:+id})})
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok){ if(MYSAY) MYSAY = null; CONVO_SIG = ''; convoLoad(false); }
      else { const u = bt.querySelector('u');
             if(u) u.textContent = (res && res.error) || 'could not reach the house'; }

                       if(u) u.textContent = 'could not reach the house'; });

function convoSend(){
  const text = convoX.value.trim();
  if(!text || CONVO_CLOSED) return;
  convoHush();
  convoGo.disabled = true;
  const message={by:ME,key:MYKEY,room:ROOM,text:text};
  if(CONVO_REPLY) message.reply_to=CONVO_REPLY;
  (window.commonsReliableFetch||fetch)('/api/say', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(withPass(message))})
    .then(function(r){ return r.json(); })
    .then(function(res){
      convoGo.disabled = CONVO_CLOSED;
      if(res && res.ok){


        MYSAY = {says:res.display_text||text, says_ts: res.ts || Math.floor(Date.now()/1000)};
        convoX.value = ''; convoGrow();
        convoReplyTo(null);
        CONVO_SIG = '';
        convoLoad(false);
        const sent=res.deliveries||[];
        if(sent.length){

          const pinged=sent.filter(function(x){return x.woke;}).map(function(x){return x.who;});
          const waiting=sent.filter(function(x){return x.queued;}).map(function(x){return x.who;});
          const lost=sent.filter(function(x){return !x.woke && !x.queued;}).map(function(x){return x.who;});
          convoNote((pinged.length ? pinged.join(', ')+' '+(pinged.length===1?'was':'were')+' pinged' : '')+
                    (pinged.length&&waiting.length ? ' · ' : '')+
                    (waiting.length ? 'word left for '+waiting.join(', ')+' — they’ll find it on their next wake' : '')+
                    ((pinged.length||waiting.length)&&lost.length ? ' · ' : '')+
                    (lost.length ? 'could not leave word for '+lost.join(', ') : ''));
        }
        if(!CONVO_TOUCH) convoX.focus();
      } else {

        convoNote((res && res.error) || 'the house did not answer \u2014 say it again');
      }
    })
    .catch(function(){
      convoGo.disabled = CONVO_CLOSED;
      convoNote('the house did not answer \u2014 nothing was lost, say it again');
    });
}

function showVerbResult(sentText, d){

  if(d && d.moved_to && !d.error){
    location.search='?scene=1&room='+encodeURIComponent(d.moved_to);

  }
  if(d && d.error){
    out += '<i>'+esc(d.error)+(d.try?' \u2014 try '+esc(d.try):'')+'</i>';
  } else if(d && Array.isArray(d.verbs)){
    out += d.verbs.map(function(v){ return '<i>'+esc(v)+'</i>'; }).join('');
    if(Array.isArray(d.rooms)) out += '<i style="opacity:.6">rooms here: '+esc(d.rooms.join(', '))+'</i>';
  } else if(d && ('people_here' in d || 'things_here' in d)){
    out += '<i>'+esc(d.room_name||d.room||'')+(d.known_room===false?' (not a known room)':'')+'</i>';
    out += '<i>here: '+(d.people_here&&d.people_here.length?esc(d.people_here.join(', ')):'no one')+'</i>';
    out += '<i>things: '+(d.things_here&&d.things_here.length?esc(d.things_here.join(', ')):'nothing')+'</i>';
  } else if(d && Array.isArray(d.lines) && d.lines.length){

    out += d.lines.map(function(v){ return '<i>'+esc(v)+'</i>'; }).join('');

    out += '<i>'+esc(JSON.stringify(d))+'</i>';

function bedAt(tx, ty){
  if(!GCAT || !GCAT.beds || !R || !R.props) return null;
  for(let i=0;i<R.props.length;i++){
    const p=R.props[i];
    if(!GCAT.beds[p.id]) continue;
    const w=p.w||1, h=p.h||1;
    if(tx >= p.x && tx < p.x+w && ty <= p.y && ty > p.y-h) return p;
  }
  return null;
}
function roomHasBeds(){
  if(!GCAT || !GCAT.beds || !R || !R.props) return false;
  return R.props.some(function(p){ return !!GCAT.beds[p.id]; });
}

function plantAt(tx, ty){
  let best=null, bd=99;
  GROW.forEach(function(g){
    const d=Math.abs(g.x-tx)+Math.abs(g.y-ty);
    if(d<bd){ bd=d; best=g; }
  });
  return bd<=1.6 ? best : null;
}

const CROP_ART={}, CROP_ART_MISS={};
function cropSprite(crop,i){
  const key=crop+'-'+i;
  if(!window.COMMONS_CONFIG.cropNames.includes(key))return null;
  if(CROP_ART_MISS[key]) return null;
  let im=CROP_ART[key];
  if(im===undefined){
    im=new Image();
    im.onerror=function(){ CROP_ART_MISS[key]=1; };
    im.src='art/crops/'+encodeURIComponent(crop)+'-'+i+'.png';
    CROP_ART[key]=im;
  }
  return (im.complete && im.naturalWidth) ? im : null;
}
function drawPlant(g){
  const X=g.x*T, Y=g.y*T;
  const i=g.stage_index||0;
  cx.save();


  cx.globalAlpha=.55; cx.fillStyle='#4a3626';
  cx.beginPath(); cx.ellipse(X,Y,T*0.26,T*0.15,0,0,6.3); cx.fill();
  cx.globalAlpha=1;
  if(g.season_phase==='seeding'){


    cx.strokeStyle='#806748'; cx.lineWidth=Math.max(1,T*.045);
    [-.16,0,.16].forEach(function(off,idx){
      const top=Y-T*(.46+idx*.07);
      cx.beginPath(); cx.moveTo(X+off*T,Y-T*.04); cx.lineTo(X+off*T*.7,top); cx.stroke();
      cx.fillStyle=idx===1?'#8b7045':'#715a3b';
      cx.beginPath(); cx.ellipse(X+off*T*.7,top,T*.10,T*.075,off,0,6.3); cx.fill();
      cx.fillStyle='#c3a568';
      for(let k=0;k<4;k++){
        cx.beginPath(); cx.arc(X+off*T*.7+(k-1.5)*T*.035,top,T*.012,0,6.3); cx.fill();
      }
    });
    cx.restore();
    return;
  }
  if(g.season_phase==='resting') cx.filter='saturate(.42) sepia(.28) opacity(.82)';
  const spr=cropSprite(g.crop,i);
  if(spr){
    const w=T*1.7, h=w;
    cx.imageSmoothingEnabled=false;
    cx.drawImage(spr, X-w/2, Y+T*0.16-h, w, h);
    cx.imageSmoothingEnabled=true;
  } else if(i===0){
    cx.fillStyle='#6d5b43';
    cx.beginPath(); cx.ellipse(X,Y-T*0.04,T*0.09,T*0.06,0,0,6.3); cx.fill();
  } else {

    const gs=T*(0.17+i*0.078);
    cx.fillStyle='#4f7a3d';
    cx.beginPath(); cx.ellipse(X-gs*0.45,Y-gs*0.5,gs*0.6,gs*0.42,-0.5,0,6.3); cx.fill();
    cx.beginPath(); cx.ellipse(X+gs*0.45,Y-gs*0.5,gs*0.6,gs*0.42, 0.5,0,6.3); cx.fill();
    if(i>=2){
      cx.fillStyle='#5d8c47';
      cx.beginPath(); cx.ellipse(X,Y-gs*0.85,gs*0.62,gs*0.55,0,0,6.3); cx.fill();
    }

    if(i>=3){
      const n=(i>=5)?5:(i===4?4:2), rr=(i>=5)?T*0.105:T*0.068;
      cx.fillStyle=g.colour||'#c0394b';
      for(let k=0;k<n;k++){
        const a=k*(6.283/n)+0.6;
        cx.beginPath();
        cx.ellipse(X+Math.cos(a)*gs*0.62, Y-gs*0.85+Math.sin(a)*gs*0.42, rr, rr, 0, 0, 6.3);
        cx.fill();
      }
    }
  }
  if(g.ripe && g.season_phase!=='resting'){   /* the house gold: ready for your hands */


    cx.strokeStyle='rgba(212,162,74,.85)'; cx.lineWidth=2;
    cx.beginPath(); cx.ellipse(X,Y,T*0.40,T*0.23,0,0,6.3); cx.stroke();
  }
  cx.restore();
}

function refreshTameBtn(force){
  if(COMPANION_REFRESH)return force?COMPANION_REFRESH.then(()=>refreshTameBtn()):COMPANION_REFRESH;
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),5000);
  COMPANION_REFRESH=fetch('/api/companions?room='+encodeURIComponent(ROOM)+
        (ME?('&as='+encodeURIComponent(ME)):'')+'&t='+Date.now(),{signal:controller.signal})
    .then(function(r){ return r.json(); })
    .then(function(d){
      WILDS=d;
      COMPANION_BOOK=d;
      syncCompanionFollowers(d.companions||[]);
      stepCompanions();cloudStep();
      witnessCompanionPets(d.companions||[]);

    'speak of gentleness, of food, of what you know of its nature. '+

function tendedLine(g){
  const t=g.tended||[];
  if(!t.length) return 'Nobody has watered it yet.';

  const seen={}, order=[];
  t.forEach(function(r){
    const k=(r.by||'')+'|'+(r.on||'');
    if(seen[k]) return; seen[k]=1; order.push(r);
  });
  return 'Watered by ' + order.map(function(r){
    return '<b>'+esc(r.by)+'</b> on '+esc(r.on);
  }).join(', ') + '.';
}

function pickedLine(g){
  const seen={}, order=[];
  (g.harvested||[]).forEach(function(r){
    const k=(r.by||'')+'|'+(r.on||'');
    if(seen[k]) return; seen[k]=1; order.push(r);
  });
  if(!order.length) return '';
  return 'Picked by ' + order.map(function(r){
    return '<b>'+esc(r.by)+'</b> on '+esc(r.on);
  }).join(', ') + '. It is still standing there, just as full.';
}
