function basketPanel(){
  loadBasket(function(d){
    if(!d) return plainAsk('Sign your name first',
      'A basket has to belong to somebody. Sign in and it will be yours, and '+
      'it will still be yours next week.');
    const picked=d.picked||{}, keys=Object.keys(picked).sort();
    const here=(d.recipes||[]).filter(function(r){ return !r.where || r.where===ROOM; });
    const made=(d.made||[]), equipment=d.equipment||{}, slots=equipment.slots||{};
    const bonus=equipment.bonuses||{}, bonusKeys=Object.keys(bonus).sort();
    const equipHtml='<p style="opacity:.75">Equipped'+
      (bonusKeys.length?' &mdash; '+bonusKeys.map(function(k){return '+'+esc(bonus[k])+' '+esc(k);}).join(', '):'')+
      ':</p>'+Object.keys(slots).map(function(slot){
        const item=slots[slot];
        return '<button class="mine gearSlot'+(item?'':' cold')+'" data-slot="'+slot+'"'+
          (item?'':' disabled')+'><b>'+esc(slot)+': '+esc(item?item.what:'empty')+'</b>'+
          '<i>'+(item?'tap to unequip':'make equipment for this slot')+'</i></button>';
      }).join('');
    askT.textContent='Your basket';
    askP.innerHTML =
      (keys.length
        ? '<p>'+keys.map(function(c){ return '<b>'+esc(picked[c])+'</b> '+esc(c); }).join(', ')+'.</p>'
        : '<p style="opacity:.8">Nothing picked yet. Anything ripe out in the '+
          'garden can be picked, and picking never costs the plant.</p>')+
      equipHtml+
      (here.length
        ? '<p style="opacity:.75">What gets made in the '+esc(ROOM)+':</p>'+
          here.map(function(r){
            return '<button class="mine recipe'+(r.can?'':' cold')+'" data-k="'+esc(r.key)+'"'+
                   (r.can?'':' disabled')+'><b>'+esc(r.preview||r.key)+'</b>'+
                   '<i>'+(r.can ? needsLine(r.needs) : esc(r.why))+'</i></button>';
          }).join('')
        : '<p style="opacity:.75">Nothing gets made in here. Try the kitchen.</p>')+
      (made.length
        ? '<p style="opacity:.75">On the shelf:</p>'+
          made.map(function(m){
            return '<button class="mine shelf" data-id="'+esc(m.id)+'"><b>'+esc(m.what)+'</b>'+
                   '<i>'+(m['for']&&m.made_by ? esc(m.made_by)+' made it for '+esc(m['for']) :
                          'made by '+esc(m.made_by))+', '+esc(m.made_on)+
                          (m.uses_total?' &mdash; '+esc(m.uses_left)+' '+
                           esc(madeUnit(m,m.uses_left))+' left':'')+'</i></button>';
          }).join('')
        : '');
    askI.style.display='none'; askX.style.display='none';
    ask.style.display='flex';
    document.getElementById('askYes').textContent='close';
    document.getElementById('askYes').onclick=closeAsk;
    document.getElementById('askNo').onclick=closeAsk;
    Array.prototype.forEach.call(askP.querySelectorAll('button.mine.recipe'), function(b){
      if(b.disabled) return;
      b.onclick=function(){
        const k=b.getAttribute('data-k');
        const rec=(d.recipes||[]).filter(function(r){return r.key===k;})[0];
        if(rec) craftFlow(rec);
      };
    });
    Array.prototype.forEach.call(askP.querySelectorAll('button.mine.shelf'), function(b){
      b.onclick=function(){
        const id=b.getAttribute('data-id');
        const m=made.filter(function(x){return x.id===id;})[0];
        if(m) madeCard(m);
      };
    });
    Array.prototype.forEach.call(askP.querySelectorAll('button.mine.gearSlot'), function(b){
      if(b.disabled) return;
      b.onclick=function(){
        commonsWriteFetch('/api/unequip',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({by:ME,key:MYKEY,slot:b.getAttribute('data-slot')})})
          .then(function(r){return r.json();})
          .then(function(res){if(!res.ok){alert(res.error||'could not unequip');return;}basketPanel();})
          .catch(function(){alert('could not reach the house');});
      };
    });
  });
}

gardenBtn.onclick=function(){
  const tx=Math.floor(P.x), ty=Math.floor(P.y-0.01);
  const here=plantAt(P.x, P.y);
  if(here) return plantCard(here);
  const bed=bedAt(tx,ty);
  if(!ME){
    return plainAsk('Sign your name first',
      'The garden remembers whose hands did what \u2014 who planted a thing and '+
      'who watered it while you were at work. It needs a name to write down.');
  }
  if(bed) return plantFlow(bed);

  if(!roomHasBeds()) return basketPanel();
  const ripe=GROW.filter(function(g){return g.ripe;}).length;
  plainAsk('The garden',
    (GROW.length
      ? GROW.length+' thing'+(GROW.length===1?'':'s')+' growing out here'+
        (ripe? ', '+ripe+' ready':'')+'. Walk onto one to see how it is doing, '+
        'or stand on any bed to put something new in. Anything ready can be '+
        'picked, and picking never costs the plant.'
      : 'Nothing in the ground yet. Stand on one of the beds and tap this again.'),
    GROW.length ? 'open my basket' : '');
};

const mineBtn=document.getElementById('mineBtn');
function refreshThingsHint(){
  if(!ME){ mineBtn.removeAttribute('data-count'); return; }
  loadBasket(function(d){
    const n=d&&d.made ? d.made.length : 0;
    if(n) mineBtn.setAttribute('data-count',String(n));
    else mineBtn.removeAttribute('data-count');
    mineBtn.title=n ? 'your things — '+n+' made thing'+(n===1?'':'s')+' waiting' : 'your things';
  });
}
function refreshMineBtn(){
  mineBtn.style.display = ME ? 'block' : 'none';
  if(ME) refreshThingsHint(); else mineBtn.removeAttribute('data-count');
}
function plainAsk(title, body, altLabel){
  askT.textContent=title; askP.textContent=body;
  askI.style.display='none'; askX.style.display='none';
  ask.style.display='flex';
  document.getElementById('askYes').textContent = altLabel || 'alright';
  document.getElementById('askYes').onclick = altLabel ? basketPanel : closeAsk;
  document.getElementById('askNo').onclick=closeAsk;
}
mineBtn.onclick=function(){
  if(HOLDING){
    plainAsk('Your hands are full',
             'You are already carrying '+HOLDING.label+'. Walk where you want it and tap the hand '+
             'to set it down, then come back for the next one.');
    return;
  }
  const q='/api/placeables?t='+Date.now()+'&as='+encodeURIComponent(ME)+'&key='+encodeURIComponent(MYKEY||'');
  const bq='/api/basket?as='+encodeURIComponent(ME)+'&key='+encodeURIComponent(MYKEY||'')+
           '&room='+encodeURIComponent(ROOM)+'&t='+Date.now();
  Promise.all([fetch(q).then(function(r){return r.json();}),
               fetch(bq).then(function(r){return r.json();})]).then(function(pair){
    const d=pair[0], basket=pair[1]; BASKET=basket;


    const mine=(d.placeables||[]).filter(function(t){ return MINE(t) && !t.fixed && !t.made_id; });
    const returned=d.inventory||[];
    const all=mine.concat(returned);
    const made=basket.made||[];
    askT.textContent='Your things';
    const here=mine.filter(function(t){return t.room===ROOM;});
    const away=mine.filter(function(t){return t.room!==ROOM;});
    function row(t,where){
      return '<button class="mine luggage" data-id="'+esc(t.id)+'"><b>'+esc(t.label)+'</b><i>'+esc(where)+'</i></button>';
    }
    function madeRow(m){
      const where=m.placed&&m.placed.room ? 'set out in the '+m.placed.room : 'in your basket';
      const left=m.uses_total ? ' &mdash; '+esc(m.uses_left)+' '+
                 esc(madeUnit(m,m.uses_left))+' left' : '';
      return '<button class="mine crafted" data-id="'+esc(m.id)+'"><b>'+esc(m.what)+'</b><i>'+esc(where)+left+'</i></button>';
    }
    function paintMine(open){
      askP.innerHTML='<u>things you can place</u>'+
        '<p style="opacity:.75">Tap one to carry it. Walk where you want it, then tap the hand.</p>'+
        (returned.length ? returned.map(function(t){return row(t,'ready to place again');}).join('') : '')+
        (here.length ? here.map(function(t){return row(t,'right here');}).join('') : '')+
        (away.length ? (open
          ? away.map(function(t){return row(t,'in the '+t.room);}).join('')
          : '<button class="mine rest"><b>'+away.length+' more elsewhere</b><i>tap to show them</i></button>') : '')+
        (!all.length?'<p style="opacity:.75">Nothing placed yet.</p>':'')+
        (made.length ? '<u>made things — place or use</u>'+made.map(madeRow).join('') :
          '<u>made things — place or use</u><p style="opacity:.75">Nothing made is waiting in your basket.</p>')+
        '<button class="mine openBasket"><b>open the whole basket</b><i>picked ingredients, recipes, equipment, and made things</i></button>'+NEWROW;
      wireMine();
    }
    askI.style.display='none'; askX.style.display='none';
    ask.style.display='flex';
    document.getElementById('askYes').textContent='close';
    document.getElementById('askYes').onclick=closeAsk;
    document.getElementById('askNo').onclick=closeAsk;
    function wireMine(){
      const nb=askP.querySelector('button.mine.new');
      if(nb) nb.onclick=function(){ addThingFlow(); };
      const rb=askP.querySelector('button.mine.rest');
      if(rb) rb.onclick=function(){ paintMine(true); };
      const ob=askP.querySelector('button.mine.openBasket');
      if(ob) ob.onclick=basketPanel;
      Array.prototype.forEach.call(askP.querySelectorAll('button.mine.luggage'), function(b){
        b.onclick=function(){
          const t=all.find(function(o){return o.id===b.getAttribute('data-id');});
          if(!t) return;
          closeAsk();
          pickUp(t);
        };
      });
      Array.prototype.forEach.call(askP.querySelectorAll('button.mine.crafted'), function(b){
        b.onclick=function(){
          const m=made.find(function(o){return o.id===b.getAttribute('data-id');});
          if(m) madeCard(m);
        };
      });
    }
    paintMine(false);
  }).catch(function(){ plainAsk('Could not reach the house',
                                'The commons did not answer just now. Try again in a moment.'); });
};
refreshKeyBtn(); refreshMineBtn();
if(HOLDING){                         /* still carrying it in from the last room */
  handBtn.style.display='block'; handBtn.classList.add('holding');
  handBtn.title='put down '+HOLDING.label;
  if(HOLDING.art) loadImg(HOLDING.art, function(i){ sprites['@'+HOLDING.id]=i; });
  bar.textContent='still holding '+HOLDING.label+' · tap the hand to set it down';
}

window.render_game_to_text=function(){
  const doorList=(R&&R.props||[]).filter(function(p){return !!(p.to||p.href);}).map(function(p){
    return {id:p.id,to:p.to||null,href:p.href||null,x:p.x,y:p.y,w:p.w||1,h:p.h||1};
  });
  return JSON.stringify({
    coordinates:'tile coordinates; origin top-left; +x right; +y down',
    room:ROOM,
    roomName:R&&R.name||'',
    environment:window.commonsAdventureState?.room===ROOM?window.commonsAdventureState.environment:
      {description:R?.description||R?.subtitle||'',landmarks:R?.landmarks||[]},
    loaded:!!R,
    player:{x:+P.x.toFixed(2),y:+P.y.toFixed(2),direction:P.dir,moving:!!P.moving,
      action:ACTION.name?{name:ACTION.name,phase:ACTION.phase,frame:ACTION.frame}:null},
    doors:doorList,
    visiblePeople:(HERE||[]).length,
    notes:(NOTES||[]).length,
    placeables:(PLACE||[]).length,
    inventory:(INVENTORY||[]).length,
    conversation:{open:ask.classList.contains('convo')&&ask.style.display!=='none',
      portrait:CONVO_PORTRAIT,replyTo:CONVO_REPLY,
      lines:CONVO_LINES.map(function(line){return {id:line.id,by:line.by,text:line.display_text||line.text,
        kind:line.kind||'speech',action:line.action||null,outcome:line.outcome||null,replyTo:line.reply_to||null};})},
    holding:HOLDING?{id:HOLDING.id,label:HOLDING.label}:null,
    rook:ALF.room===ROOM?{x:+ALF.x.toFixed(2),y:+ALF.y.toFixed(2),
      direction:ALF.dir,action:ALF.act,airborne:alfFlying()}:null
    ,companions:Object.keys(FOLLOWERS).map(function(id){
      const f=FOLLOWERS[id];
      return {id:id,instance_id:id,name:f.rec.given_name||f.rec.game?.custom_name||f.rec.animal,animal:f.rec.animal,owner:f.rec.owner,
        x:+f.x.toFixed(2),y:+f.y.toFixed(2),room:f.room,direction:f.dir,
        moving:!!f.moving,visible:companionVisible(f)};
    })
    ,foraging:{visible:roomHasForage(),ground:R&&R.forage||null}
    ,hunting:{visible:roomHasHunting(),loaded:!!HUNTING,
      huntsLeft:HUNTING?HUNTING.hunts_left:null,
      quarry:HUNTING?(HUNTING.here||[]).map(function(q){return q.quarry;}):[]}
  });
};

window.advanceTime=function(ms){
  const n=Math.max(1,Math.round(Number(ms||0)/(1000/60)));
  for(let i=0;i<n;i++) step();
  centreCam(false); draw();
};
window.commonsActions={play:playAction,stop:stopAction,has:function(name){
  const rec=MYAVATAR?ANIM[MYAVATAR]:null;
  return rec?.hasAction ? rec.hasAction(name,P.dir) : !!(rec?.actions?.[name]&&actionFrameList(rec,name,P.dir).length);
},state:function(){
  return ACTION.name?{name:ACTION.name,phase:ACTION.phase,frame:ACTION.frame}:null;
}};
window.commonsCompanions={
  refresh:()=>refreshTameBtn(true),
  visible:identity=>!!companionScreenAnchor(identity),
  result:function(action,result,requestId){
    if(action!=='companion-pet'||!result?.success||!result.companion)return false;
    const event=result.pet_event,age=event?Date.now()/1000-Number(event.time):0;
    if(!Number.isFinite(age)||age < -2||age>8)return false;
    const identity=result.companion;
    return COMPANION_HEARTS.add(identity,()=>companionScreenAnchor(identity),event?.id||requestId);
  },
  claimCard:function(result){
    const event=result?.pet_event,age=Date.now()/1000-Number(event?.time);
    return !!result?.success&&!!result.companion&&Number.isFinite(age)&&age>=-2&&age<=8&&COMPANION_HEARTS.claim(result.companion,event.id);
  },
  effects:()=>COMPANION_HEARTS.state()
};
const companionText=window.render_game_to_text;
window.render_game_to_text=()=>JSON.stringify({...JSON.parse(companionText()),
  companion_affection:COMPANION_HEARTS.state(),companion_follow_preferences:COMPANION_BOOK.companion_follow_preferences||{},
  cloud:{room:NIM.room,x:NIM.x,y:NIM.y,leader:NIM.leader,family_body:'cloud'}});
resize();
